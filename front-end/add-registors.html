<script>

    function getAuthData() {

        return {

            loggedIn:
                sessionStorage.getItem(
                    "medical_logged_in"
                ),

            email:
                sessionStorage.getItem(
                    "medical_user_email"
                ),

            role:
                sessionStorage.getItem(
                    "medical_user_role"
                )

        };

    }


    function clearMedicalLogin() {

        sessionStorage.removeItem(
            "medical_logged_in"
        );

        sessionStorage.removeItem(
            "medical_user_email"
        );

        sessionStorage.removeItem(
            "medical_user_role"
        );

    }


    function requireAdmin() {

        const auth =
            getAuthData();


        if (
            auth.loggedIn !== "true" ||
            auth.role !== "admin"
        ) {

            clearMedicalLogin();

            window.location.replace(
                "./login.html"
            );

            return false;

        }


        return true;

    }


    function logoutMedicalUser() {

        clearMedicalLogin();

        window.location.replace(
            "./login.html"
        );

    }


    requireAdmin();

</script>

<script>


/* =========================================================

/*

 */
const CAMPS_API_URL =

/*

 *

 *
 * Keep this blank for now.
 *
 * Campaigners + Assigned Camps will still work.
 *
 * Later paste a NEW ACTIVE Google Apps Script /exec URL here
 * when your Leads Web App is deployed.
 */
const LEADS_API_URL = "https://script.google.com/macros/s/AKfycbz1pRQuuOg8niURZ-oObllLAacDWSIXs20pUu19r6p8mtrRCeSXmtN9B7Bl6hd0D81V4Q/exec";



/* =========================================================

const auth =

document

/* =========================================================

let allCamps = [];

let allLeads = [];

let campaigners = [];



/* =========================================================
   SAFE JSON FETCH
========================================================= */

async function fetchJson(
    url,
    apiName
) {


    let response;


    try {


        response =
            await fetch(

                url,

                {

                    method:
                        "GET",

                    cache:
                        "no-store",

                    redirect:
                        "follow"

                }

            );


    } catch(error) {


        throw new Error(

            apiName +
            " network error: " +
            error.message

        );


    }



    const text =
        await response.text();


    console.log(
        apiName + " RESPONSE:",
        text
    );


    if (!response.ok) {

        throw new Error(

            apiName +
            " returned HTTP " +
            response.status

        );

    }


    const trimmed =
        text.trim();


    if (!trimmed) {

        throw new Error(
            apiName +
            " returned an empty response."
        );

    }


    /*
     * Google errors often return an HTML page.
     */
    if (
        trimmed.startsWith("<")
    ) {

        throw new Error(

            apiName +
            " returned HTML instead of JSON."

        );

    }


    try {

        return JSON.parse(
            trimmed
        );

    } catch(error) {

        throw new Error(

            apiName +
            " returned invalid JSON."

        );

    }

}



/* =========================================================
   FIRST NON EMPTY VALUE
========================================================= */

function firstValue() {


    for (
        let index = 0;
        index < arguments.length;
        index++
    ) {


        const value =
            arguments[index];


        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {

            return String(
                value
            ).trim();

        }

    }


    return "";

}



/* =========================================================
   NORMALIZE CAMP
========================================================= */

function normalizeCamp(
    camp
) {


    return {


        id:
            firstValue(

                camp.id,

                camp.campId,

                camp.campID,

                camp.camp_id,

                camp.CampID,

                camp["Camp ID"]

            ),


        campName:
            firstValue(

                camp.campName,

                camp.name,

                camp.camp_name,

                camp.CampName,

                camp["Camp Name"]

            ),


        campDate:
            firstValue(

                camp.campDate,

                camp.date,

                camp.camp_date,

                camp["Camp Date"]

            ),


        city:
            firstValue(

                camp.city,

                camp.City

            ),


        doctorName:
            firstValue(

                camp.doctorName,

                camp.doctor,

                camp["Doctor Name"]

            ),


        campaigner:
            firstValue(

                camp.campaigner,

                camp.campaignerEmail,

                camp.Campaigner,

                camp["Campaigner"],

                camp["Campaigner Email"]

            ),


        counsellor:
            firstValue(

                camp.counsellor,

                camp.counsellorEmail,

                camp.Counsellor,

                camp["Counsellor"],

                camp["Counsellor Email"]

            )


    };

}



/* =========================================================
   NORMALIZE LEAD
========================================================= */

/* =========================================================
   NORMALIZE LEAD
========================================================= */

function normalizeLead(
    lead
) {


    return {


        id:
            firstValue(

                lead.id,

                lead.ID,

                lead.Id,

                lead.patientId,

                lead.patientID,

                lead["ID"],

                lead["Patient ID"]

            ),


        date:
            firstValue(

                lead.date,

                lead.Date,

                lead.createdDate,

                lead["Date"]

            ),


        name:
            firstValue(

                lead.name,

                lead.Name,

                lead.patientName,

                lead["Patient Name"]

            ),


        age:
            firstValue(

                lead.age,

                lead.Age

            ),


        gender:
            firstValue(

                lead.gender,

                lead.Gender

            ),


        mobile:
            firstValue(

                lead.mobile,

                lead.Mobile,

                lead.phone,

                lead.Phone,

                lead.mobileNumber,

                lead.phoneNumber,

                lead["Mobile"],

                lead["Phone"]

            ),


        city:
            firstValue(

                lead.city,

                lead.City

            ),


        source:
            firstValue(

                lead.source,

                lead.Source

            ),


        doctorName:
            firstValue(

                lead.doctorName,

                lead.doctor,

                lead.Doctor,

                lead["Doctor Name"]

            ),


        treatment:
            firstValue(

                lead.treatment,

                lead.Treatment

            ),


        status:
            firstValue(

                lead.status,

                lead.Status

            ),


        campId:
            firstValue(

                lead.campId,

                lead.campID,

                lead.CampId,

                lead.CampID,

                lead.camp_id,

                lead["Camp ID"],

                lead["CampID"]

            ),


        campName:
            firstValue(

                lead.campName,

                lead.CampName,

                lead.camp_name,

                lead["Camp Name"]

            ),


        campaignerEmail:
            firstValue(

                lead.campaignerEmail,

                lead.campaigner,

                lead.Campaigner,

                lead.CampaignerEmail,

                lead["Campaigner Email"],

                lead["Campaigner"]

            ),


        counsellorEmail:
            firstValue(

                lead.counsellorEmail,

                lead.counsellor,

                lead.Counsellor,

                lead.CounsellorEmail,

                lead["Counsellor Email"],

                lead["Counsellor"]

            ),


        campaignerUpdatedAt:
            firstValue(

                lead.campaignerUpdatedAt,

                lead.updatedAt,

                lead.modifiedAt,

                lead["Campaigner Updated At"],

                lead["Updated At"]

            ),


        counsellorUpdatedAt:
            firstValue(

                lead.counsellorUpdatedAt,

                lead["Counsellor Updated At"]

            )


    };

}


/* =========================================================
   LOAD DATA
========================================================= */

/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {


    const body =
        document.getElementById(
            "tableBody"
        );


    const refreshBtn =
        document.getElementById(
            "refreshBtn"
        );


    refreshBtn.disabled =
        true;


    refreshBtn.textContent =
        "Loading...";


    setLoadWarning(
        ""
    );


    body.innerHTML = `

        <tr>

            <td
                colspan="5"
                class="empty"
            >

                Loading campaigner and patient data...

            </td>

        </tr>

    `;


    /*
     * Clear previous data
     */

    allCamps = [];

    allLeads = [];

    campaigners = [];


    try {


        const timestamp =
            Date.now();



        /* =====================================================
           LOAD CAMPS
        ====================================================== */

        const campResult =
            await fetchJson(

                CAMPS_API_URL +
                "?action=getCamps&t=" +
                timestamp,

                "CAMPS API"

            );


        console.log(
            "CAMP RESULT:",
            campResult
        );


        if (
            !campResult.success
        ) {

            throw new Error(

                campResult.message ||
                "Unable to load camps."

            );

        }


        allCamps =
            (
                Array.isArray(
                    campResult.camps
                )
                    ? campResult.camps
                    : []
            )
            .map(
                normalizeCamp
            );


        console.log(
            "NORMALIZED CAMPS:",
            allCamps
        );



        /* =====================================================
           LOAD PATIENT DATA
        ====================================================== */

        try {


            const leadResult =
                await fetchJson(

                    LEADS_API_URL +
                    "?action=getLeads&t=" +
                    Date.now(),

                    "LEADS API"

                );


            console.log(
                "LEAD API RESULT:",
                leadResult
            );


            if (
                !leadResult.success
            ) {

                throw new Error(

                    leadResult.message ||
                    "Unable to load patient data."

                );

            }



            /* =================================================
               GET LEADS ARRAY
            ================================================= */

            if (
                Array.isArray(
                    leadResult.leads
                )
            ) {


                allLeads =
                    leadResult.leads
                        .map(
                            normalizeLead
                        );


            } else {


                allLeads = [];


            }


            console.log(
                "RAW LEADS:",
                leadResult.leads
            );


            console.log(
                "NORMALIZED LEADS:",
                allLeads
            );


        } catch(leadError) {


            console.error(
                "PATIENT API ERROR:",
                leadError
            );


            /*
             * Campaigners should still display
             * even if patient API fails.
             */

            allLeads = [];


            setLoadWarning(

                "Campaigners loaded, but patient data could not be loaded. " +
                leadError.message

            );


        }



        /* =====================================================
           BUILD CAMPAIGNERS
        ====================================================== */

        buildCampaigners();



        /* =====================================================
           RENDER
        ====================================================== */

        renderCampaigners(
            campaigners
        );


        updateStats();



        console.log(
            "FINAL CAMPAIGNERS:",
            campaigners
        );


        console.log(
            "TOTAL CAMPAIGNERS:",
            campaigners.length
        );


        console.log(
            "TOTAL LEADS:",
            allLeads.length
        );


    } catch(error) {


        console.error(
            "CAMPAIGNER PAGE ERROR:",
            error
        );


        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="error"
                >

                    ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>

        `;


        document
            .getElementById(
                "totalCampaigners"
            )
            .textContent =
                "0";


        document
            .getElementById(
                "totalCamps"
            )
            .textContent =
                "0";


        document
            .getElementById(
                "totalPatients"
            )
            .textContent =
                "0";


        setLoadWarning(
            error.message
        );


    } finally {


        refreshBtn.disabled =
            false;


        refreshBtn.textContent =
            "Refresh";


    }

}

/* =========================================================
   BUILD CAMPAIGNERS
========================================================= */

function buildCampaigners() {


    const map =
        new Map();



    /* =====================================================
       STEP 1
       CREATE CAMPAIGNERS FROM CAMPS
    ====================================================== */

    allCamps.forEach(
        function(camp) {


            const email =
                normalizeEmail(
                    camp.campaigner
                );


            if (!email) {

                return;

            }


            if (
                !map.has(
                    email
                )
            ) {


                map.set(

                    email,

                    {

                        email:
                            email,

                        camps:
                            [],

                        leads:
                            []

                    }

                );

            }


            map
                .get(
                    email
                )
                .camps
                .push(
                    camp
                );


        }
    );



    /* =====================================================
       STEP 2
       ALSO CREATE CAMPAIGNER FROM PATIENT DATA
    ====================================================== */

    allLeads.forEach(
        function(lead) {


            const email =
                normalizeEmail(
                    lead.campaignerEmail
                );


            if (!email) {

                return;

            }


            if (
                !map.has(
                    email
                )
            ) {


                map.set(

                    email,

                    {

                        email:
                            email,

                        camps:
                            [],

                        leads:
                            []

                    }

                );

            }


        }
    );



    /* =====================================================
       STEP 3
       MATCH PATIENT DATA
    ====================================================== */

    map.forEach(
        function(
            campaigner,
            campaignerEmail
        ) {



            const assignedCampIds =
                campaigner.camps

                    .map(
                        function(camp) {

                            return normalizeKey(
                                camp.id
                            );

                        }
                    )

                    .filter(
                        Boolean
                    );



            const assignedCampNames =
                campaigner.camps

                    .map(
                        function(camp) {

                            return normalizeKey(
                                camp.campName
                            );

                        }
                    )

                    .filter(
                        Boolean
                    );



            const matchedLeads =
                allLeads.filter(
                    function(lead) {



                        const leadCampId =
                            normalizeKey(
                                lead.campId
                            );


                        const leadCampName =
                            normalizeKey(
                                lead.campName
                            );


                        const leadCampaigner =
                            normalizeEmail(
                                lead.campaignerEmail
                            );



                        /*
                         * MATCH BY CAMPAIGNER EMAIL
                         */

                        const campaignerMatch =

                            leadCampaigner &&

                            leadCampaigner ===
                            campaignerEmail;



                        /*
                         * MATCH BY CAMP ID
                         */

                        const campIdMatch =

                            leadCampId &&

                            assignedCampIds.includes(
                                leadCampId
                            );



                        /*
                         * MATCH BY CAMP NAME
                         */

                        const campNameMatch =

                            leadCampName &&

                            assignedCampNames.includes(
                                leadCampName
                            );



                        return (

                            campaignerMatch ||

                            campIdMatch ||

                            campNameMatch

                        );


                    }
                );



            console.log(
                "PATIENT MATCH:",
                campaignerEmail,
                matchedLeads
            );



            /* =================================================
               REMOVE DUPLICATES
            ================================================= */

            const unique =
                new Map();


            matchedLeads.forEach(
                function(lead) {


                    let key =
                        normalizeKey(
                            lead.id
                        );


                    if (!key) {


                        key =

                            normalizeKey(
                                lead.mobile
                            )

                            +

                            "_"

                            +

                            normalizeKey(
                                lead.date
                            );


                    }


                    /*
                     * Final fallback so blank values
                     * don't overwrite each other.
                     */

                    if (
                        !key ||
                        key === "_"
                    ) {

                        key =
                            JSON.stringify(
                                lead
                            );

                    }


                    if (
                        !unique.has(
                            key
                        )
                    ) {

                        unique.set(
                            key,
                            lead
                        );

                    }


                }
            );


            campaigner.leads =
                Array.from(
                    unique.values()
                );


        }
    );



    /* =====================================================
       FINAL CAMPAIGNER ARRAY
    ====================================================== */

    campaigners =
        Array.from(
            map.values()
        );


    campaigners.sort(
        function(a, b) {


            return a.email
                .localeCompare(
                    b.email
                );


        }
    );


}



/* =========================================================
   RENDER CAMPAIGNERS
========================================================= */

function renderCampaigners(
    records
) {


    const body =
        document.getElementById(
            "tableBody"
        );


    if (
        !records.length
    ) {


        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >

                    No campaigners found.

                </td>

            </tr>

        `;


        return;

    }



    body.innerHTML =
        records

            .map(
                function(
                    item,
                    index
                ) {


                    const rowId =
                        "campaigner_" +
                        index;


                    return `


                        <tr>


                            <td class="email">

                                ${escapeHtml(
                                    item.email
                                )}

                            </td>


                            <td>

                                ${item.camps.length}

                            </td>


                            <td>

                                ${item.leads.length}

                            </td>

}



/* =========================================================
   VIEW CAMPAIGNER
========================================================= */

function viewCampaigner(
    rowId
) {


    const row =
        document.getElementById(
            rowId
        );


    if (!row) {

        return;

    }


    const alreadyOpen =
        row.classList.contains(
            "active"
        );


    closeAll();


    if (
        alreadyOpen
    ) {

        return;

    }


    const email =
        normalizeEmail(
            row.dataset.email
        );


    const campaigner =
        campaigners.find(
            function(item) {

                return (

                    normalizeEmail(
                        item.email
                    )

                    ===

                    email

                );

            }
        );


    if (!campaigner) {

        return;

    }


    row.classList.add(
        "active"
    );


    document
        .getElementById(
            rowId +
            "_content"
        )
        .innerHTML =
            buildCampaignerDetails(
                campaigner,
                rowId
            );

}

function closeCampaigner(
    rowId
) {


    const row =
        document.getElementById(
            rowId
        );


    if (row) {

        row.classList.remove(
            "active"
        );

    }

}



function closeAll() {


    document
        .querySelectorAll(
            ".expand-row"
        )
        .forEach(
            function(row) {

                row.classList.remove(
                    "active"
                );

            }
        );

/* =========================================================
   UPDATE STATISTICS
========================================================= */

function updateStats() {


    document
        .getElementById(
            "totalCampaigners"
        )
        .textContent =
            campaigners.length;



    const uniqueCamps =
        new Set();


    campaigners.forEach(
        function(item) {


            item.camps.forEach(
                function(camp) {


                    const key =

                        normalizeKey(
                            camp.id
                        )

                        ||

                        normalizeKey(
                            camp.campName
                        );


                    if (key) {

                        uniqueCamps.add(
                            key
                        );

                    }


                }
            );


        }
    );


    document
        .getElementById(
            "totalCamps"
        )
        .textContent =
            uniqueCamps.size;



    const uniquePatients =
        new Map();


    campaigners.forEach(
        function(campaigner) {


            campaigner.leads.forEach(
                function(lead) {


                    let key =
                        normalizeKey(
                            lead.id
                        );


                    if (!key) {


                        key =

                            normalizeKey(
                                lead.mobile
                            )

                            +

                            "_"

                            +

                            normalizeKey(
                                lead.date
                            );


                    }


                    if (
                        !key ||
                        key === "_"
                    ) {

                        key =
                            JSON.stringify(
                                lead
                            );

                    }


                    if (
                        !uniquePatients.has(
                            key
                        )
                    ) {

                        uniquePatients.set(
                            key,
                            lead
                        );

                    }


                }
            );


        }
    );


    document
        .getElementById(
            "totalPatients"
        )
        .textContent =
            uniquePatients.size;


}

/* =========================================================
   LAST MODIFIED
========================================================= */

function getLastModified(
    leads
) {


    if (
        !leads.length
    ) {

        return "-";

    }


    const values =
        leads

            .map(
                function(lead) {


                    return firstValue(

                        lead.campaignerUpdatedAt,

                        lead.counsellorUpdatedAt,

                        lead.date

                    );


                }
            )

            .filter(
                Boolean
            );


    return (

        values.length
            ? values[0]
            : "-"

    );

}



/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {


            const keyword =
                this.value
                    .trim()
                    .toLowerCase();


            closeAll();


            if (!keyword) {


                renderCampaigners(
                    campaigners
                );


                return;

            }



            const filtered =
                campaigners.filter(
                    function(item) {


                        const campText =
                            item.camps

                                .map(
                                    function(camp) {


                                        return [

                                            camp.id,

                                            camp.campName,

                                            camp.city,

                                            camp.doctorName,

                                            camp.counsellor

                                        ]
                                        .join(
                                            " "
                                        );


                                    }
                                )

                                .join(
                                    " "
                                );


                        const patientText =
                            item.leads

                                .map(
                                    function(lead) {


                                        return [

                                            lead.name,

                                            lead.mobile,

                                            lead.city,

                                            lead.campId,

                                            lead.campName

                                        ]
                                        .join(
                                            " "
                                        );


                                    }
                                )

                                .join(
                                    " "
                                );


                        return (

                            item.email +
                            " " +
                            campText +
                            " " +
                            patientText

                        )
                        .toLowerCase()
                        .includes(
                            keyword
                        );


                    }
                );


            renderCampaigners(
                filtered
            );


        }
    );

document

        "refreshBtn"
    )
    .addEventListener(
        "click",
        function() {

                .value =
                    "";


            closeAll();

        }
    );



/* =========================================================
   WARNING
========================================================= */

function setLoadWarning(
    message
) {


    const warning =
        document.getElementById(
            "loadWarning"
        );


    if (!warning) {

        return;

    }


    if (!message) {


        warning.textContent =
            "";


        warning.classList.remove(
            "active"
        );


        return;

    }


    warning.textContent =
        message;


    warning.classList.add(
        "active"
    );

}



/* =========================================================
   HELPERS
========================================================= */

function normalizeEmail(
    value
) {


    return String(

        value == null
            ? ""
            : value

    )
    .trim()
    .toLowerCase();

}



function normalizeKey(
    value
) {


    return String(

        value == null
            ? ""
            : value

    )
    .trim()
    .toLowerCase();

}



function display(
    value
) {


    const text =
        String(

            value == null
                ? ""
                : value

        )
        .trim();


    if (
        !text ||
        text === "-"
    ) {

        return "-";

    }


    return escapeHtml(
        text
    );

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {


    return String(

        value == null
            ? ""
            : value

    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}

========================================================= */

loadData();
