/* =========================================================
   ADMIN AUTH
========================================================= */

function getAuthData() {

    return {

        loggedIn:
            sessionStorage.getItem(
                "medical_logged_in"
            ),

        email:
            sessionStorage.getItem(
                "medical_user_email"
            ),

        role:
            sessionStorage.getItem(
                "medical_user_role"
            )

    };

}


function clearMedicalLogin() {

    sessionStorage.removeItem(
        "medical_logged_in"
    );

    sessionStorage.removeItem(
        "medical_user_email"
    );

    sessionStorage.removeItem(
        "medical_user_role"
    );

}


function requireAdmin() {

    const auth =
        getAuthData();


    if (
        auth.loggedIn !== "true" ||
        auth.role !== "admin"
    ) {

        clearMedicalLogin();

        window.location.replace(
            "./login.html"
        );

        return false;

    }


    return true;

}


function logoutMedicalUser() {

    clearMedicalLogin();

    window.location.replace(
        "./login.html"
    );

}


requireAdmin();

/* =========================================================

const CAMPS_API_URL =
    "https://script.google.com/macros/s/AKfycbwdfXWbuvA9K8P5V76hFzGH9WrerBIkz2Uhm2T7OJRG1hmqJf0ElXcWmIvqn78neNSIZw/exec";


const LEADS_API_URL =
    "https://script.google.com/macros/s/AKfycby7DlCSbj6bjWVdjlA3Xrv1ARlhtKhYe9MbPBfvYMJGRCbKdZdZNHznW1LZAuf6lOFPnQ/exec";

/* =========================================================
   SAFE JSON FETCH
========================================================= */

async function fetchJson(
    url,
    apiName
) {


    const response =
        await fetch(

            url,

            {

                method:
                    "GET",

                cache:
                    "no-store"

            }

        );


    const text =
        await response.text();


    console.log(
        apiName +
        " RAW RESPONSE:",
        text
    );


    if (!response.ok) {

        throw new Error(

            apiName +
            " HTTP error " +
            response.status

        );

    }


    if (
        text
            .trim()
            .startsWith("<")
    ) {

        throw new Error(

            apiName +
            " returned HTML instead of JSON."

        );

    }


    try {

        return JSON.parse(
            text
        );

    } catch(error) {

        throw new Error(

            apiName +
            " returned invalid JSON."

        );

    }

}


/* =========================================================
   NORMALIZE CAMP
========================================================= */

function normalizeCamp(
    camp
) {


    return {

        id:
            firstValue(
                camp.id,
                camp.campId,
                camp.campID,
                camp.camp_id,
                camp["Camp ID"]
            ),

        campName:
            firstValue(
                camp.campName,
                camp.name,
                camp.camp_name,
                camp["Camp Name"]
            ),

        campDate:
            firstValue(
                camp.campDate,
                camp.date,
                camp.camp_date,
                camp["Camp Date"]
            ),

        city:
            firstValue(
                camp.city,
                camp.City
            ),

        doctorName:
            firstValue(
                camp.doctorName,
                camp.doctor,
                camp["Doctor Name"]
            ),

        campaigner:
            firstValue(
                camp.campaigner,
                camp.campaignerEmail,
                camp["Campaigner"]
            ),

        counsellor:
            firstValue(
                camp.counsellor,
                camp.counsellorEmail,
                camp["Counsellor"]
            )

    };

}


/* =========================================================
   NORMALIZE LEAD

   Handles different property names from Apps Script.
========================================================= */

function normalizeLead(
    lead
) {


    return {

        id:
            firstValue(
                lead.id,
                lead.ID,
                lead.patientId
            ),

        date:
            firstValue(
                lead.date,
                lead.Date
            ),

        name:
            firstValue(
                lead.name,
                lead.Name
            ),

        age:
            firstValue(
                lead.age,
                lead.Age
            ),

        gender:
            firstValue(
                lead.gender,
                lead.Gender
            ),

        mobile:
            firstValue(
                lead.mobile,
                lead.Mobile,
                lead.phone,
                lead.Phone
            ),

        city:
            firstValue(
                lead.city,
                lead.City
            ),

        source:
            firstValue(
                lead.source,
                lead.Source
            ),

        doctorName:
            firstValue(
                lead.doctorName,
                lead.doctor,
                lead["Doctor Name"]
            ),

        treatment:
            firstValue(
                lead.treatment,
                lead.Treatment
            ),

        status:
            firstValue(
                lead.status,
                lead.Status
            ),

        /* =========================================
           IMPORTANT CAMP ID FIX
        ========================================= */

        campId:
            firstValue(

                lead.campId,

                lead.campID,

                lead.camp_id,

                lead.CampId,

                lead.CampID,

                lead["Camp ID"]

            ),

        campName:
            firstValue(

                lead.campName,

                lead.camp_name,

                lead.CampName,

                lead["Camp Name"]

            ),

        campaignerEmail:
            firstValue(

                lead.campaignerEmail,

                lead.campaigner,

                lead["Campaigner Email"]

            ),

        counsellorEmail:
            firstValue(

                lead.counsellorEmail,

                lead.counsellor,

                lead["Counsellor Email"]

            ),

        counsellorUpdatedAt:
            firstValue(

                lead.counsellorUpdatedAt,

                lead.updatedAt,

                lead.modifiedAt,

                lead["Counsellor Updated At"]

            )

    };

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {


    const body =
        document.getElementById(
            "tableBody"
        );


    body.innerHTML = `

        <tr>

            <td
                colspan="5"
                class="empty"
            >
                Loading counsellor data...
            </td>

        </tr>

    `;


    try {


        const timestamp =
            Date.now();


        const campResult =
            await fetchJson(

                CAMPS_API_URL +
                "?action=getCamps&t=" +
                timestamp,

                "CAMPS API"

            );


        if (
            !campResult.success
        ) {

            throw new Error(

                campResult.message ||
                "Unable to load camps."

            );

        }


        /*
         * NORMALIZE CAMP DATA
         */

        allCamps =
            (
                Array.isArray(
                    campResult.camps
                )
                ? campResult.camps
                : []
            )
            .map(
                normalizeCamp
            );


        console.log(
            "NORMALIZED CAMPS:",
            allCamps
        );


        const leadResult =
            await fetchJson(

                LEADS_API_URL +
                "?action=getLeads&t=" +
                timestamp,

                "LEADS API"

            );


        if (
            !leadResult.success
        ) {

            throw new Error(

                leadResult.message ||
                "Unable to load patient data."

            );

        }


        /*
         * NORMALIZE LEAD DATA
         */

        allLeads =
            (
                Array.isArray(
                    leadResult.leads
                )
                ? leadResult.leads
                : []
            )
            .map(
                normalizeLead
            );


        console.log(
            "NORMALIZED LEADS:",
            allLeads
        );


        /*
         * VERY IMPORTANT DEBUG
         */

        allLeads.forEach(
            function(lead) {


                console.log(

                    "PATIENT CAMP CHECK:",

                    lead.id,

                    "Camp ID:",

                    lead.campId,

                    "Camp Name:",

                    lead.campName,

                    "Counsellor:",

                    lead.counsellorEmail

                );


            }
        );


        buildCounsellors();


        renderCounsellors(
            counsellors
        );


        updateStats();


    } catch(error) {


        console.error(
            "LOAD ERROR:",
            error
        );


        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="error"
                >

                    ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>

        `;


    }

}


/* =========================================================
   BUILD COUNSELLORS

   MAIN FIX IS HERE
========================================================= */

function buildCounsellors() {


    const map =
        new Map();


    /* =====================================================
       STEP 1
       CREATE COUNSELLORS FROM CAMP ASSIGNMENTS
    ===================================================== */

    allCamps.forEach(
        function(camp) {


            const email =
                normalizeEmail(
                    camp.counsellor
                );


            if (!email) {

                return;

            }


            if (
                !map.has(
                    email
                )
            ) {

                map.set(

                    email,

                    {

                        email:
                            email,

                        camps:
                            [],

                        leads:
                            []

                    }

                );

            }


            map
                .get(email)
                .camps
                .push(
                    camp
                );


        }
    );


    /* =====================================================
       STEP 2
       FIND PATIENTS FOR EACH COUNSELLOR

       IMPORTANT:
       We do NOT depend only on counsellorEmail.

       We first find all Camp IDs assigned
       to each counsellor.

       Then patients in those camps belong
       to that counsellor's handled data.
    ===================================================== */

    map.forEach(
        function(
            counsellor,
            counsellorEmail
        ) {


            /*
             * Camp IDs assigned to this counsellor.
             */

            const assignedCampIds =
                counsellor.camps
                    .map(
                        function(camp) {

                            return normalizeKey(
                                camp.id
                            );

                        }
                    )
                    .filter(Boolean);


            /*
             * Camp names as fallback.
             */

            const assignedCampNames =
                counsellor.camps
                    .map(
                        function(camp) {

                            return normalizeKey(
                                camp.campName
                            );

                        }
                    )
                    .filter(Boolean);


            console.log(

                "COUNSELLOR:",

                counsellorEmail,

                "ASSIGNED CAMP IDs:",

                assignedCampIds

            );


            const matchedLeads =
                allLeads.filter(
                    function(lead) {


                        const leadCampId =
                            normalizeKey(
                                lead.campId
                            );


                        const leadCampName =
                            normalizeKey(
                                lead.campName
                            );


                        const actualCounsellor =
                            normalizeEmail(
                                lead.counsellorEmail
                            );


                        /* =================================
                           MATCH 1:
                           Camp ID
                        ================================= */

                        const campIdMatch =

                            leadCampId &&

                            assignedCampIds.includes(
                                leadCampId
                            );


                        /* =================================
                           MATCH 2:
                           Camp name fallback
                        ================================= */

                        const campNameMatch =

                            leadCampName &&

                            assignedCampNames.includes(
                                leadCampName
                            );


                        /* =================================
                           MATCH 3:
                           Exact counsellor audit
                        ================================= */

                        const counsellorMatch =

                            actualCounsellor &&

                            actualCounsellor ===
                            counsellorEmail;


                        return (

                            campIdMatch ||

                            campNameMatch ||

                            counsellorMatch

                        );


                    }
                );


            /*
             * Remove duplicates if one lead
             * matched through multiple methods.
             */

            const unique =
                new Map();


            matchedLeads.forEach(
                function(lead) {


                    const key =
                        lead.id ||
                        (
                            lead.mobile +
                            lead.date
                        );


                    if (
                        !unique.has(
                            key
                        )
                    ) {

                        unique.set(
                            key,
                            lead
                        );

                    }


                }
            );


            counsellor.leads =
                Array.from(
                    unique.values()
                );


        }
    );


    counsellors =
        Array.from(
            map.values()
        );


    counsellors.sort(
        function(a,b) {

            return a.email
                .localeCompare(
                    b.email
                );

        }
    );


    console.log(
        "FINAL COUNSELLORS:",
        counsellors
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderCounsellors(
    records
) {


    const body =
        document.getElementById(
            "tableBody"
        );


    if (
        !records.length
    ) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >
                    No counsellors found.
                </td>

            </tr>

        `;


        return;

    }


    body.innerHTML =
        records
            .map(
                function(
                    item,
                    index
                ) {


                    const rowId =
                        "counsellor_" +
                        index;


                    return `


                        <!-- COUNSELLOR -->

                        <tr>


                            <td class="email">

                                ${escapeHtml(
                                    item.email
                                )}

                            </td>


                            <td>

                                ${item.camps.length}

                            </td>


                            <td>

                                ${item.leads.length}

                            </td>


                            <td>

                                ${escapeHtml(
                                    getLastModified(
                                        item.leads
                                    )
                                )}

                            </td>


                            <td>

                                <button
                                    type="button"
                                    class="view-btn"
                                    onclick="
                                        viewCounsellor(
                                            '${rowId}'
                                        )
                                    "
                                >
                                    View Data
                                </button>

                            </td>


                        </tr>



                        <!-- EXPANDED DATA -->

                        <tr
                            id="${rowId}"
                            class="expand-row"
                            data-email="${escapeHtml(
                                item.email
                            )}"
                        >

                            <td
                                colspan="5"
                                class="expand-cell"
                            >

                                <div
                                    id="${rowId}_content"
                                    class="panel"
                                >
                                </div>

                            </td>

                        </tr>


                    `;


                }
            )
            .join("");

}


/* =========================================================
   VIEW DATA
========================================================= */

function viewCounsellor(
    rowId
) {


    closeAll();


    const row =
        document.getElementById(
            rowId
        );


    if (!row) {

        return;

    }


    const email =
        normalizeEmail(
            row.dataset.email
        );


    const counsellor =
        counsellors.find(
            function(item) {

                return (
                    normalizeEmail(
                        item.email
                    )
                    ===
                    email
                );

            }
        );


    if (!counsellor) {

        return;

    }


    row.classList.add(
        "active"
    );


    document
        .getElementById(
            rowId +
            "_content"
        )
        .innerHTML =
            buildDetails(

                counsellor,

                rowId

            );

}


/* =========================================================
   BUILD DETAILS
========================================================= */

function buildDetails(
    counsellor,
    rowId
) {


    /* =====================================================
       CAMPS
    ===================================================== */

    let campsHtml =
        "";


    if (
        counsellor.camps.length
    ) {


        campsHtml =
            counsellor.camps
                .map(
                    function(camp) {


                        return `

                            <div class="camp-box">


                                <div class="camp-id">

                                    ${display(
                                        camp.id
                                    )}

                                </div>


                                <div class="camp-name">

                                    ${display(
                                        camp.campName
                                    )}

                                </div>


                                <div class="camp-meta">

                                    Date:
                                    ${display(
                                        camp.campDate
                                    )}

                                    <br>

                                    City:
                                    ${display(
                                        camp.city
                                    )}

                                    <br>

                                    Doctor:
                                    ${display(
                                        camp.doctorName
                                    )}

                                    <br>

                                    Campaigner:
                                    ${display(
                                        camp.campaigner
                                    )}

                                </div>


                            </div>

                        `;


                    }
                )
                .join("");


    } else {


        campsHtml = `

            <div class="camp-box">

                No assigned camps.

            </div>

        `;

    }


    /* =====================================================
       PATIENTS
    ===================================================== */

    let patientHtml =
        "";


    if (
        !counsellor.leads.length
    ) {


        patientHtml = `

            <div class="empty">

                No patient records found
                for this counsellor's camps.

            </div>

        `;


    } else {


        const rows =
            counsellor.leads
                .map(
                    function(lead) {


                        const exactAudit =

                            normalizeEmail(
                                lead.counsellorEmail
                            )

                            ===

                            normalizeEmail(
                                counsellor.email
                            );


                        const auditText =

                            exactAudit

                                ? "Modified by Counsellor"

                                : "Assigned Camp Patient";


                        const auditClass =

                            exactAudit

                                ? "modified"

                                : "assignment";


                        return `

                            <tr>


                                <td class="patient-id">

                                    ${display(
                                        lead.id
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.campId
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.campName
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.date
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.name
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.age
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.gender
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.mobile
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.city
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.source
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.doctorName
                                    )}

                                </td>


                                <td>

                                    ${display(
                                        lead.treatment
                                    )}

                                </td>


                                <td>

                                    <span class="status-badge">

                                        ${display(
                                            lead.status
                                        )}

                                    </span>

                                </td>


                                <td class="modified">

                                    ${display(
                                        lead.counsellorUpdatedAt
                                    )}

                                </td>


                                <td class="${auditClass}">

                                    ${auditText}

                                </td>


                            </tr>

                        `;


                    }
                )
                .join("");


        patientHtml = `


            <div class="patient-wrapper">


                <table class="patient-table">


                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Camp ID</th>

                            <th>Camp Name</th>

                            <th>Date</th>

                            <th>Name</th>

                            <th>Age</th>

                            <th>Gender</th>

                            <th>Phone</th>

                            <th>City</th>

                            <th>Source</th>

                            <th>Doctor</th>

                            <th>Treatment</th>

                            <th>Status</th>

                            <th>Modified At</th>

                            <th>Handled Status</th>

                        </tr>

                    </thead>


                    <tbody>

                        ${rows}

                    </tbody>


                </table>


            </div>

        `;

    }


    return `


        <div class="panel-header">


            <div>

                <h3>

                    ${escapeHtml(
                        counsellor.email
                    )}

                </h3>


                <p>

                    Assigned camps and patient records
                    handled by this counsellor.

                </p>

            </div>


            <span class="count-badge">

                ${counsellor.leads.length}

                ${
                    counsellor.leads.length === 1
                        ? "Patient"
                        : "Patients"
                }

            </span>


        </div>



        <div class="camps-grid">

            ${campsHtml}

        </div>



        ${patientHtml}



        <div class="panel-footer">

            <button
                type="button"
                class="cancel-btn"
                onclick="
                    closeCounsellor(
                        '${rowId}'
                    )
                "
            >
                Cancel
            </button>

        </div>


    `;

}


/* =========================================================
   CLOSE
========================================================= */

function closeCounsellor(
    rowId
) {


    const row =
        document.getElementById(
            rowId
        );


    if (row) {

        row.classList.remove(
            "active"
        );

    }

}


function closeAll() {


    document
        .querySelectorAll(
            ".expand-row"
        )
        .forEach(
            function(row) {

                row.classList.remove(
                    "active"
                );

            }
        );

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {


    document
        .getElementById(
            "totalCounsellors"
        )
        .textContent =
            counsellors.length;


    const assignedCamps =
        allCamps.filter(
            function(camp) {

                return (
                    normalizeEmail(
                        camp.counsellor
                    ) !== ""
                );

            }
        );


    document
        .getElementById(
            "totalCamps"
        )
        .textContent =
            assignedCamps.length;


    /*
     * IMPORTANT:
     * Count unique handled patients.
     */

    const patientIds =
        new Set();


    counsellors.forEach(
        function(counsellor) {


            counsellor.leads
                .forEach(
                    function(lead) {


                        const key =

                            lead.id ||

                            (
                                lead.mobile +
                                "_" +
                                lead.date
                            );


                        patientIds.add(
                            key
                        );


                    }
                );


        }
    );


    document
        .getElementById(
            "totalPatients"
        )
        .textContent =
            patientIds.size;

}


/* =========================================================
   LAST MODIFIED
========================================================= */

function getLastModified(
    leads
) {


    const modified =
        leads
            .map(
                function(lead) {

                    return String(
                        lead.counsellorUpdatedAt ||
                        ""
                    )
                    .trim();

                }
            )
            .filter(Boolean);


    if (
        !modified.length
    ) {

        return "-";

    }


    return modified[0];

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {


            const term =
                this.value
                    .trim()
                    .toLowerCase();


            if (!term) {

                renderCounsellors(
                    counsellors
                );

                return;

            }


            const filtered =
                counsellors.filter(
                    function(item) {


                        const campText =
                            item.camps
                                .map(
                                    function(camp) {

                                        return [

                                            camp.id,

                                            camp.campName,

                                            camp.city,

                                            camp.doctorName,

                                            camp.campaigner

                                        ]
                                        .join(" ");

                                    }
                                )
                                .join(" ");


                        const patientText =
                            item.leads
                                .map(
                                    function(lead) {

                                        return [

                                            lead.id,

                                            lead.name,

                                            lead.mobile,

                                            lead.city,

                                            lead.treatment,

                                            lead.status

                                        ]
                                        .join(" ");

                                    }
                                )
                                .join(" ");


                        return (

                            item.email +
                            " " +
                            campText +
                            " " +
                            patientText

                        )
                        .toLowerCase()
                        .includes(
                            term
                        );


                    }
                );


            renderCounsellors(
                filtered
            );


        }
    );


/* =========================================================
   REFRESH
========================================================= */

document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        function() {


            document
                .getElementById(
                    "searchInput"
                )
                .value =
                    "";


            closeAll();


            loadData();


        }
    );


/* =========================================================
   HELPERS
========================================================= */

function firstValue(
    ...values
) {


    for (
        const value
        of values
    ) {


        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {

            return String(
                value
            )
            .trim();

        }

    }


    return "";

}


function normalizeEmail(
    value
) {

    return String(
        value == null
            ? ""
            : value
    )
    .trim()
    .toLowerCase();

}


function normalizeKey(
    value
) {

    return String(
        value == null
            ? ""
            : value
    )
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "");

}


function display(
    value
) {


    const text =
        String(
            value == null
                ? ""
                : value
        )
        .trim();


    if (
        !text ||
        text === "-"
    ) {

        return "-";

    }


    return escapeHtml(
        text
    );

}


function escapeHtml(
    value
) {


    return String(
        value == null
            ? ""
            : value
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   INITIAL
========================================================= */

loadData();

</script>
