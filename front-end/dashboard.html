<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Medical Camps Registration
</title>


<script>

/* ==========================================
   AUTH
========================================== */

function getAuthData() {

    return {

        loggedIn:
            sessionStorage.getItem(
                "medical_logged_in"
            ),

        email:
            sessionStorage.getItem(
                "medical_user_email"
            ),

        role:
            sessionStorage.getItem(
                "medical_user_role"
            )

    };

}


function clearMedicalLogin() {

    sessionStorage.removeItem(
        "medical_logged_in"
    );

    sessionStorage.removeItem(
        "medical_user_email"
    );

    sessionStorage.removeItem(
        "medical_user_role"
    );

}


function requireCampaigner() {

    const auth =
        getAuthData();


    if (
        auth.loggedIn !== "true" ||
        auth.role !== "campaigner"
    ) {

        clearMedicalLogin();

        window.location.replace(
            "./login.html"
        );

        return false;

    }


    return true;

}


function logoutMedicalUser() {

    clearMedicalLogin();

    window.location.replace(
        "./login.html"
    );

}


requireCampaigner();

</script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background:
        #f4f7fb;

    color:
        #0f172a;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


.dashboard {

    max-width:
        1500px;

    margin:
        auto;

    padding:
        30px;

}


.dashboard-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        20px;

    margin-bottom:
        25px;

}


.header-actions {

    display:
        flex;

    gap:
        10px;

}


button {

    border:
        none;

    border-radius:
        8px;

    padding:
        11px 18px;

    cursor:
        pointer;

    font-weight:
        600;

}


.add-btn {

    background:
        #2563eb;

    color:
        white;

}


.logout-btn {

    background:
        #dc2626;

    color:
        white;

}


.camp-card {

    background:
        white;

    padding:
        20px;

    border-radius:
        12px;

    margin-bottom:
        22px;

}


.camp-card h3 {

    margin-top:
        0;

}


.camp-select {

    width:
        100%;

    max-width:
        450px;

    padding:
        11px;

    border:
        1px solid
        #cbd5e1;

    border-radius:
        8px;

}


.assignment {

    margin-top:
        12px;

    color:
        #475569;

}


.table-card {

    background:
        white;

    padding:
        22px;

    border-radius:
        14px;

}


.table-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        20px;

    margin-bottom:
        18px;

}


.search-box {

    width:
        330px;

    padding:
        10px;

    border:
        1px solid
        #cbd5e1;

    border-radius:
        8px;

}


.table-wrapper {

    overflow-x:
        auto;

}


table {

    width:
        100%;

    min-width:
        1500px;

    border-collapse:
        collapse;

}


th,
td {

    padding:
        13px;

    border-bottom:
        1px solid
        #e2e8f0;

    text-align:
        left;

    font-size:
        13px;

}


th {

    background:
        #f8fafc;

}


.camp-badge {

    display:
        inline-block;

    padding:
        5px 9px;

    background:
        #dbeafe;

    color:
        #1d4ed8;

    border-radius:
        15px;

    font-weight:
        600;

}


.popup-overlay {

    position:
        fixed;

    inset:
        0;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(15,23,42,.65);

}


.popup-overlay.active {

    display:
        flex;

}


.popup {

    width:
        100%;

    max-width:
        650px;

    background:
        white;

    padding:
        25px;

    border-radius:
        14px;

}


.popup-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

}


.close-btn {

    background:
        transparent;

    font-size:
        25px;

}


.form-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        15px;

}


.form-group {

    display:
        flex;

    flex-direction:
        column;

    gap:
        6px;

}


.form-group label {

    font-size:
        13px;

    font-weight:
        600;

}


.form-group input,
.form-group select {

    padding:
        11px;

    border:
        1px solid
        #cbd5e1;

    border-radius:
        8px;

}


.submit-btn {

    width:
        100%;

    margin-top:
        18px;

    background:
        #2563eb;

    color:
        white;

}


.message {

    margin-top:
        12px;

    font-size:
        13px;

}


.success {
    color: #15803d;
}


.error {
    color: #dc2626;
}


.no-assignment {

    padding:
        15px;

    background:
        #fee2e2;

    color:
        #991b1b;

    border-radius:
        8px;

}


@media(max-width:768px) {

    .dashboard {
        padding: 15px;
    }


    .dashboard-header,
    .table-header {

        flex-direction:
            column;

        align-items:
            stretch;

    }


    .form-grid {

        grid-template-columns:
            1fr;

    }


    .search-box {

        width:
            100%;

    }

}

</style>

</head>


<body>


<div class="dashboard">


    <div class="dashboard-header">

        <div>

            <h1>
                Medical Camps Registration
            </h1>

            <div id="userEmail"></div>

        </div>


        <div class="header-actions">

            <button
                id="openPopup"
                class="add-btn"
                type="button"
            >
                + Add Data
            </button>


            <button
                type="button"
                class="logout-btn"
                onclick="logoutMedicalUser()"
            >
                Logout
            </button>

        </div>

    </div>



    <!-- ASSIGNED CAMP -->

    <div class="camp-card">

        <h3>
            Assigned Camp
        </h3>


        <select
            id="campSelector"
            class="camp-select"
        >
            <option value="">
                Loading assigned camps...
            </option>
        </select>


        <div
            id="campDetails"
            class="assignment"
        ></div>


        <div
            id="campError"
        ></div>

    </div>



    <!-- TABLE -->

    <div class="table-card">


        <div class="table-header">

            <h2>
                Patient Data
            </h2>


            <input
                type="search"
                id="leadSearch"
                class="search-box"
                placeholder="Search patient..."
            >

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Camp</th>

                        <th>Date</th>

                        <th>Name</th>

                        <th>Age</th>

                        <th>Gender</th>

                        <th>Phone</th>

                        <th>City</th>

                        <th>Source</th>

                        <th>Doctor</th>

                        <th>Treatment</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="leadTableBody">

                    <tr>

                        <td colspan="12">
                            Loading...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>



<!-- ADD PATIENT -->

<div
    id="leadPopup"
    class="popup-overlay"
>

    <div class="popup">

        <div class="popup-header">

            <h2>
                Add Patient Data
            </h2>


            <button
                type="button"
                id="closePopup"
                class="close-btn"
            >
                ×
            </button>

        </div>


        <form id="medicalLeadForm">


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Name *
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Age *
                    </label>

                    <input
                        type="number"
                        id="age"
                        min="1"
                        max="120"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Gender *
                    </label>

                    <select
                        id="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Phone *
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        City *
                    </label>

                    <input
                        type="text"
                        id="city"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Source *
                    </label>

                    <input
                        type="text"
                        id="source"
                        required
                    >

                </div>


            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitLead"
            >
                Submit Patient
            </button>


            <div
                id="formMessage"
                class="message"
            ></div>


        </form>

    </div>

</div>



<script>

/* =========================================================
   APIs
========================================================= */

const LEADS_API_URL =
    "https://script.google.com/macros/s/AKfycbw-nwjRZU93h_icjvdO7AJAHFfIJB7vpeVIqjY9B-V7Thd3bJ1pajRtjNYGXaYHoGGMfA/exec";


const CAMPS_API_URL =
    "https://script.google.com/macros/s/AKfycbw4w8S_nHPcdn3RWj-wm2XGT_6Il70lScUQFP71UooBPM7Npf0zedq_Vf2-4TdIBtTD1w/exec";


/* =========================================================
   USER
========================================================= */

const currentUser =
    getAuthData();


const currentEmail =
    String(
        currentUser.email || ""
    )
    .trim()
    .toLowerCase();


document
    .getElementById(
        "userEmail"
    )
    .textContent =
        currentEmail;


/* =========================================================
   DATA
========================================================= */

let assignedCamps = [];

let selectedCamp = null;

let allLeads = [];



/* =========================================================
   ELEMENTS
========================================================= */

const campSelector =
    document.getElementById(
        "campSelector"
    );


const campDetails =
    document.getElementById(
        "campDetails"
    );


const campError =
    document.getElementById(
        "campError"
    );


const tableBody =
    document.getElementById(
        "leadTableBody"
    );


const popup =
    document.getElementById(
        "leadPopup"
    );


const form =
    document.getElementById(
        "medicalLeadForm"
    );


const formMessage =
    document.getElementById(
        "formMessage"
    );


const openPopup =
    document.getElementById(
        "openPopup"
    );



/* =========================================================
   LOAD CAMPS ASSIGNED TO CAMPAIGNER
========================================================= */

async function loadAssignedCamps() {

    try {

        const response =
            await fetch(

                CAMPS_API_URL +
                "?action=getCamps&t=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Unable to load camps."
            );

        }


        const camps =
            Array.isArray(
                result.camps
            )
            ? result.camps
            : [];


        /*
         * IMPORTANT:
         * match logged-in campaigner's
         * email against camp assignment.
         */

        assignedCamps =
            camps.filter(
                function(camp) {

                    return (
                        String(
                            camp.campaigner || ""
                        )
                        .trim()
                        .toLowerCase()
                        ===
                        currentEmail
                    );

                }
            );


        renderCampSelector();


    } catch(error) {

        campError.className =
            "no-assignment";


        campError.textContent =
            error.message;


        openPopup.disabled =
            true;

    }

}



/* =========================================================
   CAMP SELECTOR
========================================================= */

function renderCampSelector() {

    if (
        assignedCamps.length === 0
    ) {

        campSelector.innerHTML = `

            <option value="">
                No camp assigned
            </option>

        `;


        campError.className =
            "no-assignment";


        campError.textContent =
            "No medical camp is assigned to your login email.";


        openPopup.disabled =
            true;


        selectedCamp =
            null;


        renderTable([]);


        return;

    }


    campError.className = "";

    campError.textContent = "";


    campSelector.innerHTML =
        assignedCamps
            .map(
                function(camp) {

                    return `

                        <option
                            value="${escapeHtml(
                                camp.id
                            )}"
                        >
                            ${escapeHtml(
                                camp.id
                            )}
                            -
                            ${escapeHtml(
                                camp.campName
                            )}
                            -
                            ${escapeHtml(
                                camp.campDate
                            )}
                        </option>

                    `;

                }
            )
            .join("");


    selectCamp(
        assignedCamps[0].id
    );

}



/* =========================================================
   SELECT CAMP
========================================================= */

campSelector.addEventListener(
    "change",
    function() {

        selectCamp(
            this.value
        );

    }
);


function selectCamp(
    campId
) {

    selectedCamp =
        assignedCamps.find(
            function(camp) {

                return (
                    String(camp.id) ===
                    String(campId)
                );

            }
        ) || null;


    if (!selectedCamp) {

        return;

    }


    campDetails.innerHTML = `

        <strong>
            ${escapeHtml(
                selectedCamp.campName
            )}
        </strong>

        &nbsp; | &nbsp;

        ${escapeHtml(
            selectedCamp.city
        )}

        &nbsp; | &nbsp;

        ${escapeHtml(
            selectedCamp.doctorName
        )}

        &nbsp; | &nbsp;

        Counsellor:
        ${escapeHtml(
            selectedCamp.counsellor
        )}

    `;


    loadLeads();

}



/* =========================================================
   LOAD LEADS
========================================================= */

async function loadLeads() {

    if (!selectedCamp) {

        renderTable([]);

        return;

    }


    try {

        const response =
            await fetch(

                LEADS_API_URL +
                "?action=getLeads&t=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message
            );

        }


        const serverLeads =
            Array.isArray(
                result.leads
            )
            ? result.leads
            : [];


        /*
         * CRITICAL:
         * Show only selected Camp ID.
         */

        allLeads =
            serverLeads.filter(
                function(lead) {

                    return (
                        String(
                            lead.campId || ""
                        )
                        .trim()
                        ===
                        String(
                            selectedCamp.id
                        )
                    );

                }
            );


        renderTable(
            allLeads
        );


    } catch(error) {

        tableBody.innerHTML = `

            <tr>

                <td colspan="12">
                    ${escapeHtml(
                        error.message
                    )}
                </td>

            </tr>

        `;

    }

}



/* =========================================================
   RENDER
========================================================= */

function renderTable(
    leads
) {

    if (!leads.length) {

        tableBody.innerHTML = `

            <tr>

                <td colspan="12">
                    No patient data for this camp.
                </td>

            </tr>

        `;

        return;

    }


    tableBody.innerHTML =
        leads.map(
            function(lead) {

                return `

                    <tr>

                        <td>
                            ${escapeHtml(
                                lead.id
                            )}
                        </td>

                        <td>

                            <span class="camp-badge">

                                ${escapeHtml(
                                    lead.campId
                                )}

                                -

                                ${escapeHtml(
                                    lead.campName
                                )}

                            </span>

                        </td>

                        <td>
                            ${escapeHtml(
                                lead.date
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                lead.name
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                lead.age
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                lead.gender
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                lead.mobile
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                lead.city
                            )}
                        </td>

                        <td>
                            ${displayValue(
                                lead.source
                            )}
                        </td>

                        <td>
                            ${displayValue(
                                lead.doctorName
                            )}
                        </td>

                        <td>
                            ${displayValue(
                                lead.treatment
                            )}
                        </td>

                        <td>
                            ${displayValue(
                                lead.status
                            )}
                        </td>

                    </tr>

                `;

            }
        )
        .join("");

}



/* =========================================================
   POPUP
========================================================= */

openPopup.addEventListener(
    "click",
    function() {

        if (!selectedCamp) {

            alert(
                "No camp selected."
            );

            return;

        }


        form.reset();

        formMessage.textContent = "";

        popup.classList.add(
            "active"
        );

    }
);


document
    .getElementById(
        "closePopup"
    )
    .addEventListener(
        "click",
        function() {

            popup.classList.remove(
                "active"
            );

        }
    );



/* =========================================================
   SAVE PATIENT
========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!selectedCamp) {

            showMessage(
                "Please select a camp.",
                "error"
            );

            return;

        }


        const data = {

            action:
                "addLead",

            /*
             * CAMP RELATIONSHIP
             */

            campId:
                selectedCamp.id,

            campName:
                selectedCamp.campName,

            campaignerEmail:
                currentEmail,

            /*
             * PATIENT
             */

            name:
                document
                    .getElementById(
                        "name"
                    )
                    .value
                    .trim(),

            age:
                document
                    .getElementById(
                        "age"
                    )
                    .value
                    .trim(),

            gender:
                document
                    .getElementById(
                        "gender"
                    )
                    .value,

            mobile:
                document
                    .getElementById(
                        "mobile"
                    )
                    .value
                    .trim(),

            city:
                document
                    .getElementById(
                        "city"
                    )
                    .value
                    .trim(),

            source:
                document
                    .getElementById(
                        "source"
                    )
                    .value
                    .trim()

        };


        const button =
            document.getElementById(
                "submitLead"
            );


        button.disabled =
            true;


        button.textContent =
            "Submitting...";


        try {

            const response =
                await fetch(

                    LEADS_API_URL,

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify(
                                data
                            )

                    }

                );


            const result =
                await response.json();


            if (!result.success) {

                throw new Error(
                    result.message
                );

            }


            showMessage(
                "Patient added to " +
                selectedCamp.campName +
                " successfully.",
                "success"
            );


            await loadLeads();


            setTimeout(
                function() {

                    popup.classList.remove(
                        "active"
                    );

                    form.reset();

                },
                700
            );


        } catch(error) {

            showMessage(
                error.message,
                "error"
            );

        } finally {

            button.disabled =
                false;


            button.textContent =
                "Submit Patient";

        }

    }
);



/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "leadSearch"
    )
    .addEventListener(
        "input",
        function() {

            const keyword =
                this.value
                    .trim()
                    .toLowerCase();


            if (!keyword) {

                renderTable(
                    allLeads
                );

                return;

            }


            const filtered =
                allLeads.filter(
                    function(lead) {

                        return [

                            lead.id,
                            lead.name,
                            lead.mobile,
                            lead.city,
                            lead.source,
                            lead.doctorName,
                            lead.treatment,
                            lead.status

                        ]
                        .join(" ")
                        .toLowerCase()
                        .includes(
                            keyword
                        );

                    }
                );


            renderTable(
                filtered
            );

        }
    );



/* =========================================================
   HELPERS
========================================================= */

function displayValue(
    value
) {

    const text =
        String(
            value || ""
        )
        .trim();


    return (
        !text ||
        text === "-"
    )
        ? "-"
        : escapeHtml(text);

}


function showMessage(
    text,
    type
) {

    formMessage.className =
        "message " +
        type;


    formMessage.textContent =
        text;

}


function escapeHtml(
    value
) {

    return String(
        value == null
            ? ""
            : value
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}



/* =========================================================
   START
========================================================= */

loadAssignedCamps();

</script>


</body>

</html>
