<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Super Admin Dashboard
    </title>


    <!-- ================================================
         SUPER ADMIN AUTHENTICATION
    ================================================= -->

    <script>

    (function () {

        "use strict";


        const SUPER_ADMIN_EMAIL =
            "rakeshdev7465@gmail.com";


        function readValue(
            key
        ) {

            return (
                sessionStorage.getItem(
                    key
                ) ||
                localStorage.getItem(
                    key
                ) ||
                ""
            );

        }


        function normalize(
            value
        ) {

            return String(
                value == null
                    ? ""
                    : value
            )
                .trim()
                .toLowerCase();

        }


        function clearMedicalLogin() {

            const keys = [
                "medical_logged_in",
                "medical_user_email",
                "medical_user_role",
                "medical_user_dashboard",
                "medical_user_is_super_admin",
                "medical_user_base_role"
            ];


            keys.forEach(
                function (
                    key
                ) {

                    sessionStorage.removeItem(
                        key
                    );

                    localStorage.removeItem(
                        key
                    );

                }
            );

        }


        function restoreSessionStorage() {

            const keys = [
                "medical_logged_in",
                "medical_user_email",
                "medical_user_role",
                "medical_user_dashboard",
                "medical_user_is_super_admin",
                "medical_user_base_role"
            ];


            keys.forEach(
                function (
                    key
                ) {

                    const value =
                        localStorage.getItem(
                            key
                        );


                    if (
                        value &&
                        !sessionStorage.getItem(
                            key
                        )
                    ) {

                        sessionStorage.setItem(
                            key,
                            value
                        );

                    }

                }
            );

        }


        function requireSuperAdmin() {

            restoreSessionStorage();


            const loggedIn =
                readValue(
                    "medical_logged_in"
                );


            const email =
                normalize(
                    readValue(
                        "medical_user_email"
                    )
                );


            const role =
                normalize(
                    readValue(
                        "medical_user_role"
                    )
                );


            const dashboard =
                String(
                    readValue(
                        "medical_user_dashboard"
                    )
                )
                    .trim()
                    .replace(
                        /^\.\//,
                        ""
                    )
                    .replace(
                        /^\//,
                        ""
                    );


            const isSuperAdmin =
                (
                    loggedIn === "true" &&
                    email === SUPER_ADMIN_EMAIL &&
                    role === "super_admin" &&
                    (
                        !dashboard ||
                        dashboard ===
                            "super-admin-dashboard.html"
                    )
                );


            if (
                !isSuperAdmin
            ) {

                console.warn(
                    "SUPER ADMIN ACCESS DENIED:",
                    {
                        loggedIn,
                        email,
                        role,
                        dashboard
                    }
                );


                clearMedicalLogin();


                window.location.replace(
                    "./login.html"
                );


                return false;

            }


            sessionStorage.setItem(
                "medical_logged_in",
                "true"
            );

            sessionStorage.setItem(
                "medical_user_email",
                email
            );

            sessionStorage.setItem(
                "medical_user_role",
                "super_admin"
            );

            sessionStorage.setItem(
                "medical_user_dashboard",
                "super-admin-dashboard.html"
            );

            sessionStorage.setItem(
                "medical_user_is_super_admin",
                "true"
            );


            return true;

        }


        window.requireSuperAdmin =
            requireSuperAdmin;


        requireSuperAdmin();


    })();

    </script>

</head>

<body>

    <h1>Super Admin</h1>

</body>
