<script>

function getAuthData() {

    return {

        loggedIn:
            sessionStorage.getItem(
                "medical_logged_in"
            ),

        email:
            sessionStorage.getItem(
                "medical_user_email"
            ),

        role:
            sessionStorage.getItem(
                "medical_user_role"
            )

    };

}


function clearMedicalLogin() {

    sessionStorage.removeItem(
        "medical_logged_in"
    );

    sessionStorage.removeItem(
        "medical_user_email"
    );

    sessionStorage.removeItem(
        "medical_user_role"
    );

}


function requireAdmin() {

    const auth =
        getAuthData();


    if (
        auth.loggedIn !== "true" ||
        auth.role !== "admin"
    ) {

        clearMedicalLogin();

        window.location.replace(
            "./login.html"
        );

        return false;

    }


    return true;

}


function logoutMedicalUser() {

    clearMedicalLogin();

    window.location.replace(
        "./login.html"
    );

}


requireAdmin();

</script>

<script>

/* =========================================================
   URLS
========================================================= */


const LEADS_API_URL =
    "https://script.google.com/macros/s/AKfycbz1pRQuuOg8niURZ-oObllLAacDWSIXs20pUu19r6p8mtrRCeSXmtN9B7Bl6hd0D81V4Q/exec";


const CAMPS_API_URL =
    "https://script.google.com/macros/s/AKfycbwdfXWbuvA9K8P5V76hFzGH9WrerBIkz2Uhm2T7OJRG1hmqJf0ElXcWmIvqn78neNSIZw/exec";




/* =========================================================
   ADMIN
========================================================= */

const auth =
    getAuthData();


document
    .getElementById(
        "adminEmail"
    )
    .textContent =
        auth.email ||
        "Admin";


/* =========================================================
   DATA
========================================================= */

let allCamps = [];

let allLeads = [];

let counsellors = [];


/* =========================================================
   FETCH
========================================================= */

async function fetchJson(
    url
) {

    const response =
        await fetch(

            url,

            {

                cache:
                    "no-store"

            }

        );


    const text =
        await response.text();


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    if (
        text
            .trim()
            .startsWith("<")
    ) {

        throw new Error(
            "API returned HTML instead of JSON."
        );

    }


    return JSON.parse(
        text
    );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {

    try {

        const campResult =
            await fetchJson(

                CAMPS_API_URL +
                "?action=getCamps&t=" +
                Date.now()

            );


        if (!campResult.success) {

            throw new Error(
                campResult.message
            );

        }


        allCamps =
            Array.isArray(
                campResult.camps
            )
                ? campResult.camps
                : [];


        const map =
            new Map();


        allCamps.forEach(
            function(camp) {

                const email =
                    normalizeEmail(
                        camp.counsellor
                    );


                if (!email) {

                    return;

                }


                if (
                    !map.has(
                        email
                    )
                ) {

                    map.set(

                        email,

                        {

                            email:
                                email,

                            camps:
                                [],

                            leads:
                                []

                        }

                    );

                }


                map
                    .get(email)
                    .camps
                    .push(
                        camp
                    );

            }
        );


        counsellors =
            Array.from(
                map.values()
            );


        /* =============================================
           GET EACH COUNSELLOR'S PATIENTS
        ============================================= */

        await Promise.all(

            counsellors.map(
                async function(
                    counsellor
                ) {

                    const campIds =
                        counsellor.camps
                            .map(
                                function(camp) {

                                    return String(
                                        camp.id || ""
                                    )
                                    .trim();

                                }
                            )
                            .filter(
                                Boolean
                            );


                    const url =

                        LEADS_API_URL +

                        "?action=getCounsellorLeads" +

                        "&campIds=" +

                        encodeURIComponent(
                            campIds.join(",")
                        ) +

                        "&counsellorEmail=" +

                        encodeURIComponent(
                            counsellor.email
                        ) +

                        "&t=" +

                        Date.now();


                    const result =
                        await fetchJson(
                            url
                        );


                    if (!result.success) {

                        throw new Error(
                            result.message
                        );

                    }


                    counsellor.leads =
                        Array.isArray(
                            result.leads
                        )
                            ? result.leads
                            : [];


                }
            )

        );


        buildGlobalLeadList();


        renderCounsellors(
            counsellors
        );


        updateStats();


    } catch(error) {

        console.error(
            error
        );


        document
            .getElementById(
                "tableBody"
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="error"
                    >

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;

    }

}


/* =========================================================
   GLOBAL PATIENT LIST
========================================================= */

function buildGlobalLeadList() {

    const map =
        new Map();


    counsellors.forEach(
        function(counsellor) {

            counsellor.leads
                .forEach(
                    function(lead) {

                        const key =
                            lead.id ||
                            (
                                lead.mobile +
                                "_" +
                                lead.date
                            );


                        if (
                            !map.has(
                                key
                            )
                        ) {

                            map.set(
                                key,
                                lead
                            );

                        }

                    }
                );

        }
    );


    allLeads =
        Array.from(
            map.values()
        );

}


/* =========================================================
   RENDER
========================================================= */

function renderCounsellors(
    records
) {

    const body =
        document.getElementById(
            "tableBody"
        );


    if (!records.length) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >

                    No counsellors found.

                </td>

            </tr>

        `;


        return;

    }


    body.innerHTML =
        records
            .map(
                function(
                    item,
                    index
                ) {

                    const rowId =
                        "counsellor_" +
                        index;


                    return `

                        <tr>

                            <td class="email">

                                ${escapeHtml(
                                    item.email
                                )}

                            </td>


                            <td>

                                ${item.camps.length}

                            </td>


                            <td>

                                ${item.leads.length}

                            </td>


                            <td>

                                ${escapeHtml(
                                    getLastModified(
                                        item.leads
                                    )
                                )}

                            </td>


                            <td>

                                <button
                                    class="view-btn"
                                    onclick="
                                        showCounsellor(
                                            '${rowId}'
                                        )
                                    "
                                >
                                    View Data
                                </button>

                            </td>

                        </tr>


                        <tr
                            id="${rowId}"
                            class="expand-row"
                            data-email="${escapeHtml(
                                item.email
                            )}"
                        >

                            <td
                                colspan="5"
                                class="expand-cell"
                            >

                                <div
                                    id="${rowId}_content"
                                    class="panel"
                                ></div>

                            </td>

                        </tr>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   VIEW
========================================================= */

function showCounsellor(
    rowId
) {

    closeAll();


    const row =
        document.getElementById(
            rowId
        );


    const email =
        normalizeEmail(
            row.dataset.email
        );


    const counsellor =
        counsellors.find(
            function(item) {

                return (
                    normalizeEmail(
                        item.email
                    )
                    ===
                    email
                );

            }
        );


    if (!counsellor) {

        return;

    }


    row.classList.add(
        "active"
    );


    document
        .getElementById(
            rowId +
            "_content"
        )
        .innerHTML =
            buildDetails(

                counsellor,

                rowId

            );

}


/* =========================================================
   DETAILS
========================================================= */

function buildDetails(
    counsellor,
    rowId
) {

    const camps =
        counsellor.camps
            .map(
                function(camp) {

                    return `

                        <div class="camp-box">

                            <div class="camp-id">

                                ${display(
                                    camp.id
                                )}

                            </div>

                            <div class="camp-name">

                                ${display(
                                    camp.campName
                                )}

                            </div>

                            <div class="camp-meta">

                                Date:
                                ${display(
                                    camp.campDate
                                )}

                                <br>

                                City:
                                ${display(
                                    camp.city
                                )}

                                <br>

                                Doctor:
                                ${display(
                                    camp.doctorName
                                )}

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    let patients;


    if (
        !counsellor.leads.length
    ) {

        patients = `

            <div class="empty">

                No patients handled.

            </div>

        `;

    } else {

        const rows =
            counsellor.leads
                .map(
                    function(lead) {

                        return `

                            <tr>

                                <td class="patient-id">

                                    ${display(
                                        lead.id
                                    )}

                                </td>

                                <td>
                                    ${display(
                                        lead.campId
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.campName
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.date
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.name
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.age
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.gender
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.mobile
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.city
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.source
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.doctorName
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.treatment
                                    )}
                                </td>

                                <td>
                                    ${display(
                                        lead.status
                                    )}
                                </td>

                                <td class="modified">

                                    ${display(
                                        lead.counsellorUpdatedAt
                                    )}

                                </td>

                            </tr>

                        `;

                    }
                )
                .join("");


        patients = `

            <div class="patient-wrapper">

                <table class="patient-table">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Camp ID</th>

                            <th>Camp Name</th>

                            <th>Date</th>

                            <th>Name</th>

                            <th>Age</th>

                            <th>Gender</th>

                            <th>Phone</th>

                            <th>City</th>

                            <th>Source</th>

                            <th>Doctor</th>

                            <th>Treatment</th>

                            <th>Status</th>

                            <th>Modified At</th>

                        </tr>

                    </thead>


                    <tbody>

                        ${rows}

                    </tbody>

                </table>

            </div>

        `;

    }


    return `

        <div class="panel-header">

            <div>

                <h3>

                    ${escapeHtml(
                        counsellor.email
                    )}

                </h3>

                <p>

                    Assigned camps and handled patients.

                </p>

            </div>


            <span class="badge">

                ${counsellor.leads.length}
                Patients

            </span>

        </div>


        <div class="camps-grid">

            ${camps}

        </div>


        ${patients}


        <div class="panel-footer">

            <button
                class="cancel-btn"
                onclick="
                    closeCounsellor(
                        '${rowId}'
                    )
                "
            >
                Cancel
            </button>

        </div>

    `;

}


/* =========================================================
   CLOSE
========================================================= */

function closeCounsellor(
    rowId
) {

    const row =
        document.getElementById(
            rowId
        );


    if (row) {

        row.classList.remove(
            "active"
        );

    }

}


function closeAll() {

    document
        .querySelectorAll(
            ".expand-row"
        )
        .forEach(
            function(row) {

                row.classList.remove(
                    "active"
                );

            }
        );

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    document
        .getElementById(
            "totalCounsellors"
        )
        .textContent =
            counsellors.length;


    document
        .getElementById(
            "totalCamps"
        )
        .textContent =
            allCamps.length;


    document
        .getElementById(
            "totalPatients"
        )
        .textContent =
            allLeads.length;

}


/* =========================================================
   LAST MODIFIED
========================================================= */

function getLastModified(
    leads
) {

    if (!leads.length) {

        return "-";

    }


    const values =
        leads
            .map(
                function(lead) {

                    return String(

                        lead.counsellorUpdatedAt ||

                        lead.date ||

                        ""

                    )
                    .trim();

                }
            )
            .filter(
                Boolean
            );


    return (
        values.length
            ? values[0]
            : "-"
    );

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {

            const keyword =
                this.value
                    .trim()
                    .toLowerCase();


            if (!keyword) {

                renderCounsellors(
                    counsellors
                );

                return;

            }


            const filtered =
                counsellors.filter(
                    function(item) {

                        const campText =
                            item.camps
                                .map(
                                    function(camp) {

                                        return [

                                            camp.id,

                                            camp.campName,

                                            camp.city

                                        ]
                                        .join(" ");

                                    }
                                )
                                .join(" ");


                        return (

                            item.email +
                            " " +
                            campText

                        )
                        .toLowerCase()
                        .includes(
                            keyword
                        );

                    }
                );


            renderCounsellors(
                filtered
            );

        }
    );


/* =========================================================
   REFRESH
========================================================= */

document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        function() {

            document
                .getElementById(
                    "searchInput"
                )
                .value =
                    "";


            closeAll();


            loadData();

        }
    );


/* =========================================================
   HELPERS
========================================================= */

function normalizeEmail(
    value
) {

    return String(
        value == null
            ? ""
            : value
    )
    .trim()
    .toLowerCase();

}


function display(
    value
) {

    const text =
        String(
            value == null
                ? ""
                : value
        )
        .trim();


    if (
        !text ||
        text === "-"
    ) {

        return "-";

    }


    return escapeHtml(
        text
    );

}


function escapeHtml(
    value
) {

    return String(
        value == null
            ? ""
            : value
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   INITIAL
========================================================= */

loadData();

</script>
