<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OP Data</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background: #f5f7fb;
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
      }
      .topbar {
        background: #0f172a;
        color: white;
        padding: 16px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .brand {
        font-size: 20px;
        font-weight: 700;
      }
      .topbar-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .admin-email {
        color: #cbd5e1;
        font-size: 13px;
      }
      .nav-btn,
      .logout-btn,
      .refresh-btn,
      .view-btn,
      .close-btn,
      .save-btn {
        border: 0;
        border-radius: 8px;
        padding: 10px 15px;
        color: white;
        cursor: pointer;
        font-weight: 700;
      }
      .nav-btn,
      .refresh-btn,
      .view-btn {
        background: #2563eb;
      }
      .logout-btn,
      .close-btn {
        background: #dc2626;
      }
      .save-btn {
        background: #16a34a;
      }
      .save-btn:disabled {
        background: #94a3b8;
        cursor: wait;
      }
      .page {
        max-width: 1600px;
        margin: auto;
        padding: 30px;
      }
      .page-heading {
        margin-bottom: 24px;
      }
      .page-heading h1 {
        margin: 0 0 8px;
      }
      .page-heading p {
        margin: 0;
        color: #64748b;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      }
      .stat-card,
      .card {
        background: white;
        border-radius: 13px;
        padding: 23px;
        box-shadow: 0 2px 12px rgba(15, 23, 42, 0.05);
      }
      .stat-title {
        color: #64748b;
        font-size: 13px;
        margin-bottom: 7px;
      }
      .stat-value {
        font-size: 29px;
        font-weight: 700;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }
      .toolbar h2 {
        margin: 0;
      }
      .toolbar-right {
        display: flex;
        gap: 10px;
      }
      .search-input {
        width: 360px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px 12px;
      }
      .table-wrapper,
      .patient-wrapper {
        overflow-x: auto;
      }
      .main-table,
      .patient-table {
        width: 100%;
        border-collapse: collapse;
      }
      .main-table {
        min-width: 900px;
      }
      .main-table th,
      .patient-table th {
        text-align: left;
        background: #f1f5f9;
        padding: 12px;
        white-space: nowrap;
        font-size: 12px;
      }
      .main-table td,
      .patient-table td {
        border-bottom: 1px solid #e2e8f0;
        padding: 12px;
        font-size: 13px;
        vertical-align: top;
      }
      .camp-id,
      .patient-id {
        font-weight: 700;
        color: #2563eb;
      }
      .camp-details strong,
      .camp-details span {
        display: block;
      }
      .camp-details span {
        color: #64748b;
        font-size: 12px;
        margin-top: 5px;
      }
      .expand-row {
        display: none;
      }
      .expand-row.active {
        display: table-row;
      }
      .expand-cell {
        padding: 0 !important;
        background: #f8fafc;
      }
      .panel {
        padding: 24px;
        border-top: 3px solid #2563eb;
      }
      .panel-header,
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
      }
      .panel-header {
        margin-bottom: 18px;
      }
      .panel-header h3,
      .section-title h4 {
        margin: 0;
      }
      .panel-header p {
        color: #64748b;
        font-size: 13px;
      }
      .badge {
        display: inline-block;
        padding: 6px 11px;
        border-radius: 25px;
        color: #1d4ed8;
        background: #dbeafe;
        font-size: 12px;
        font-weight: 700;
      }
      .camp-summary {
        display: grid;
        grid-template-columns: repeat(5, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .summary-box {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px;
      }
      .summary-label {
        font-size: 11px;
        text-transform: uppercase;
        color: #64748b;
        margin-bottom: 6px;
      }
      .summary-value {
        font-size: 13px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .section-title {
        margin-bottom: 12px;
      }
      .patient-wrapper {
        border: 1px solid #e2e8f0;
        border-radius: 9px;
        background: white;
      }
      .patient-table {
        min-width: 1950px;
      }
      .patient-table th {
        background: #eaf1f8;
        font-size: 11px;
      }
      .patient-table td {
        font-size: 12px;
        vertical-align: middle;
      }
      .field-input,
      .field-select {
        padding: 8px;
        border-radius: 7px;
        border: 1px solid #cbd5e1;
        min-width: 135px;
        max-width: 185px;
        background: white;
      }
      .field-input[type="number"] {
        min-width: 105px;
        width: 115px;
      }
      .saved-text {
        display: block;
        min-height: 12px;
        color: #15803d;
        font-size: 11px;
        margin-top: 5px;
      }
      .panel-footer {
        text-align: center;
        margin-top: 22px;
      }
      .empty,
      .error {
        padding: 30px;
        text-align: center;
        color: #64748b;
      }
      .error {
        color: #dc2626;
      }
      .load-note {
        color: #64748b;
        margin-top: 12px;
        font-size: 12px;
      }
      .modified {
        color: #15803d;
        font-weight: 700;
      }
      @media (max-width: 1000px) {
        .camp-summary {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 768px) {
        .topbar {
          padding: 15px;
        }
        .page {
          padding: 15px;
        }
        .stats,
        .camp-summary {
          grid-template-columns: 1fr;
        }
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }
        .toolbar-right {
          flex-direction: column;
        }
        .search-input {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Medical Camps Admin</div>
      <div class="topbar-actions">
        <span id="adminEmail" class="admin-email">Admin</span
        ><button class="nav-btn" onclick="location.href = './op-data.html'">
          OP Data</button
        ><button
          class="nav-btn"
          onclick="location.href = './updated-ip-data.html'"
        >
          IP Data</button
        ><button
          class="nav-btn"
          onclick="location.href = './admin-dashboard.html'"
        >
          Admin Dashboard</button
        ><button class="logout-btn" onclick="logoutMedicalUser()">
          Logout
        </button>
      </div>
    </header>
    <main class="page">
      <div class="page-heading">
        <h1>OP Data</h1>
        <p>Camp-wise OP patient records. No IP conversion required.</p>
      </div>
      <section class="stats">
        <div class="stat-card">
          <div class="stat-title">Total Camps</div>
          <div class="stat-value" id="totalCamps">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Total Patients</div>
          <div class="stat-value" id="totalPatients">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Camps With Patients</div>
          <div class="stat-value" id="thirdStat">0</div>
        </div>
      </section>
      <div class="card">
        <div class="toolbar">
          <h2>OP Data</h2>
          <div class="toolbar-right">
            <input
              class="search-input"
              id="searchInput"
              type="search"
              placeholder="Search camp, patient, phone, doctor..."
            /><button class="refresh-btn" id="refreshBtn">Refresh</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="main-table">
            <thead>
              <tr>
                <th>Camp ID</th>
                <th>Camp Details</th>
                <th>Patients</th>
                <th>Last Modified</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="5" class="empty">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="loadNote" class="load-note"></div>
      </div>
    </main>
    <script>
      const THIRD_STAT = "camps";

      const LEADS_API_URL =
        "https://script.google.com/macros/s/AKfycbwaY7WhanDFXtLn4PkSym_BmT_oGnea4-Ckm30wyJDkO6odi4f2HP-4YB07aPQEGd3t0Q/exec";
      const CAMPS_API_URL =
        "https://script.google.com/macros/s/AKfycbw4w8S_nHPcdn3RWj-wm2XGT_6Il70lScUQFP71UooBPM7Npf0zedq_Vf2-4TdIBtTD1w/exec";
      // The existing IP page uses a different Apps Script deployment for saving IP fields.
      const IP_API_URL =
        "https://script.google.com/macros/s/AKfycbycX2Uj2_Q70w-Sn3OZktXuWsVQXGwWv11BaIeBYVcsguhKAmVXACiML3Py1zAFQR0twA/exec";
      const GET_CAMP_PATIENTS_ACTION = "getCounsellorLeads";
      let allCamps = [];
      let allLeads = [];
      let visibleCamps = [];
      let loadVersion = 0;
      function getAuthData() {
        return {
          loggedIn: sessionStorage.getItem("medical_logged_in"),
          role: sessionStorage.getItem("medical_user_role"),
          email: sessionStorage.getItem("medical_user_email"),
        };
      }
      function logoutMedicalUser() {
        [
          "medical_logged_in",
          "medical_user_role",
          "medical_user_email",
        ].forEach((k) => sessionStorage.removeItem(k));
        location.replace("./login.html");
      }
      if (getAuthData().loggedIn !== "true" || getAuthData().role !== "admin") {
        location.replace("./login.html");
      }
      document.getElementById("adminEmail").textContent =
        getAuthData().email || "Admin";
      async function fetchJson(url) {
        const r = await fetch(url, { cache: "no-store" });
        const t = await r.text();
        if (!r.ok) throw Error("HTTP " + r.status);
        if (t.trim().startsWith("<"))
          throw Error("API returned HTML instead of JSON");
        try {
          return JSON.parse(t);
        } catch {
          throw Error("Invalid JSON from API");
        }
      }
      function str(v) {
        return String(v ?? "").trim();
      }
      function escapeHtml(v) {
        return str(v)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      function display(v) {
        return str(v) ? escapeHtml(v) : "-";
      }
      function readRows(data) {
        return Array.isArray(data.records)
          ? data.records
          : Array.isArray(data.leads)
            ? data.leads
            : Array.isArray(data.data)
              ? data.data
              : [];
      }
      function leadId(lead) {
        return str(lead.id || lead.leadId);
      }
      function keyFor(lead, idx, campId) {
        return leadId(lead)
          ? "id:" + leadId(lead)
          : "row:" +
              campId +
              ":" +
              idx +
              ":" +
              str(lead.mobile) +
              ":" +
              str(lead.date);
      }
      function latest(leads) {
        const v = leads
          .map((x) =>
            str(x.counsellorUpdatedAt || x.updatedAt || x.modifiedAt || x.date),
          )
          .filter(Boolean);
        if (!v.length) return "-";
        return v.sort((a, b) => (Date.parse(b) || 0) - (Date.parse(a) || 0))[0];
      }
      function formatDateTime(v) {
        if (!str(v)) return "-";
        const d = new Date(v);
        return Number.isNaN(d.getTime())
          ? str(v)
          : d.toLocaleString("en-IN", {
              timeZone: "Asia/Kolkata",
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
              hour12: true,
            });
      }
      async function getCampLeads(camp) {
        const campId = str(camp.id);
        if (!campId) return [];
        const params = new URLSearchParams({
          action: GET_CAMP_PATIENTS_ACTION,
          campIds: campId,
          counsellorEmail: str(camp.counsellor).toLowerCase(),
          t: String(Date.now()),
        });
        const data = await fetchJson(LEADS_API_URL + "?" + params);
        if (!data.success)
          throw Error(data.message || "Camp leads request failed");
        const found = new Map();
        readRows(data).forEach((lead, idx) => {
          const key = keyFor(lead, idx, campId);
          if (!found.has(key))
            found.set(key, {
              ...lead,
              campId: str(lead.campId) || campId,
              campName: str(lead.campName) || str(camp.campName),
            });
        });
        return [...found.values()];
      }
      async function loadData() {
        const version = ++loadVersion;
        document.getElementById("tableBody").innerHTML =
          '<tr><td colspan="5" class="empty">Loading patient data...</td></tr>';
        document.getElementById("loadNote").textContent = "";
        try {
          const data = await fetchJson(
            CAMPS_API_URL + "?action=getCamps&t=" + Date.now(),
          );
          if (!data.success)
            throw Error(data.message || "Could not fetch camps");
          const camps = (Array.isArray(data.camps) ? data.camps : []).map(
            (c) => ({ ...c, leads: [], loadError: "" }),
          );
          const results = await Promise.allSettled(camps.map(getCampLeads));
          if (version !== loadVersion) return;
          results.forEach((result, i) => {
            if (result.status === "fulfilled") camps[i].leads = result.value;
            else
              camps[i].loadError =
                result.reason?.message || "Unable to load patient data";
          });
          allCamps = camps;
          // Additional IP fields are merged by patient ID, but conversion status is NEVER used as a filter.
          await enrichWithSavedIpDetails(version);
          if (version !== loadVersion) return;
          const byId = new Map();
          allCamps.forEach((c) =>
            c.leads.forEach((lead, i) => {
              const key = keyFor(lead, i, str(c.id));
              if (!byId.has(key)) byId.set(key, lead);
            }),
          );
          allLeads = [...byId.values()];
          applySearch();
          updateStats();
          const n = camps.filter((c) => c.loadError).length;
          if (n)
            document.getElementById("loadNote").textContent =
              n + " camp(s) failed to load. Expand those camps for details.";
        } catch (e) {
          if (version !== loadVersion) return;
          console.error(e);
          document.getElementById("tableBody").innerHTML =
            '<tr><td colspan="5" class="error">' +
            escapeHtml(e.message) +
            "</td></tr>";
          document.getElementById("loadNote").textContent = "";
        }
      }
      async function enrichWithSavedIpDetails(version) {
        try {
          const result = await fetchJson(
            IP_API_URL + "?action=getIpData&t=" + Date.now(),
          );
          if (version !== loadVersion || !result.success) return;
          const saved = new Map();
          readRows(result).forEach((r) => {
            if (leadId(r)) saved.set(leadId(r), r);
          });
          const fields = [
            "surgeryDate",
            "surgeryStatus",
            "surgeryLocation",
            "surgeryDoctor",
            "modeOfPayment",
            "amountPaid",
            "ipUpdatedAt",
            "convertedAt",
            "convertedTime",
          ];
          allCamps.forEach((c) =>
            c.leads.forEach((l) => {
              const old = saved.get(leadId(l));
              if (old)
                fields.forEach((f) => {
                  if (old[f] !== undefined && old[f] !== null && old[f] !== "")
                    l[f] = old[f];
                });
            }),
          );
        } catch (e) {
          console.warn("Optional IP data merge skipped:", e);
        }
      }
      function updateStats() {
        document.getElementById("totalCamps").textContent = allCamps.length;
        document.getElementById("totalPatients").textContent = allLeads.length;
        document.getElementById("thirdStat").textContent =
          THIRD_STAT === "completed"
            ? allLeads.filter(
                (x) => str(x.surgeryStatus).toLowerCase() === "completed",
              ).length
            : allCamps.filter((c) => c.leads.length).length;
      }
      function applySearch() {
        const q = str(
          document.getElementById("searchInput").value,
        ).toLowerCase();
        visibleCamps = allCamps.filter(
          (c) =>
            !q ||
            [
              c.id,
              c.campName,
              c.city,
              c.campDate,
              c.doctorName,
              ...c.leads.flatMap((l) => [
                l.id,
                l.name,
                l.mobile,
                l.city,
                l.status,
                l.treatment,
                l.surgeryStatus,
                l.surgeryDoctor,
              ]),
            ]
              .join(" ")
              .toLowerCase()
              .includes(q),
        );
        renderCamps();
      }
      function renderCamps() {
        const b = document.getElementById("tableBody");
        if (!visibleCamps.length) {
          b.innerHTML =
            '<tr><td colspan="5" class="empty">No camps found.</td></tr>';
          return;
        }
        b.innerHTML = visibleCamps
          .map(
            (c, i) =>
              `<tr><td class="camp-id">${display(c.id)}</td><td class="camp-details"><strong>${display(c.campName)}</strong><span>Date: ${display(c.campDate)}</span><span>City: ${display(c.city)}</span><span>Doctor: ${display(c.doctorName)}</span></td><td><strong>${c.leads.length}</strong></td><td>${display(latest(c.leads))}</td><td><button class="view-btn" data-index="${i}" onclick="toggleCamp(this)">View Details</button></td></tr><tr class="expand-row" id="expand-${i}"><td colspan="5" class="expand-cell"><div class="panel" id="panel-${i}"></div></td></tr>`,
          )
          .join("");
      }
      function toggleCamp(btn) {
        const i = Number(btn.dataset.index);
        const row = document.getElementById("expand-" + i);
        const opening = !row.classList.contains("active");
        document
          .querySelectorAll(".expand-row")
          .forEach((r) => r.classList.remove("active"));
        if (opening) {
          row.classList.add("active");
          document.getElementById("panel-" + i).innerHTML = buildDetails(
            visibleCamps[i],
          );
        }
      }
      function summary(c) {
        return [
          ["Camp ID", c.id],
          ["Camp Name", c.campName],
          ["Camp Date", c.campDate],
          ["City", c.city],
          ["Doctor", c.doctorName],
        ]
          .map(
            ([k, v]) =>
              `<div class="summary-box"><div class="summary-label">${k}</div><div class="summary-value">${display(v)}</div></div>`,
          )
          .join("");
      }
      function detailsShell(c, table) {
        return `<div class="panel-header"><div><h3>${display(c.campName)}</h3><p>All patient records for this camp.</p></div><span class="badge">${c.leads.length} Patients</span></div><div class="camp-summary">${summary(c)}</div>${c.loadError ? '<div class="error">' + escapeHtml(c.loadError) + "</div>" : !c.leads.length ? '<div class="empty">No patients for this camp.</div>' : table}<div class="panel-footer"><button class="close-btn" onclick="document.querySelectorAll('.expand-row').forEach(r=>r.classList.remove('active'))">Close</button></div>`;
      }
      document
        .getElementById("searchInput")
        .addEventListener("input", applySearch);
      document.getElementById("refreshBtn").addEventListener("click", () => {
        document.getElementById("searchInput").value = "";
        loadData();
      });

      function buildDetails(c) {
        const rows = c.leads
          .map(
            (l) =>
              `<tr><td class="patient-id">${display(l.id)}</td><td>${display(l.campId || c.id)}</td><td>${display(l.campName || c.campName)}</td><td>${display(l.date)}</td><td>${display(l.name)}</td><td>${display(l.age)}</td><td>${display(l.gender)}</td><td>${display(l.mobile)}</td><td>${display(l.city)}</td><td>${display(l.source)}</td><td>${display(l.doctorName || c.doctorName)}</td><td>${display(l.treatment)}</td><td>${display(l.status)}</td><td class="modified">${display(l.counsellorUpdatedAt || l.updatedAt || l.modifiedAt)}</td><td>${display(l.telesalesEmail)}</td></tr>`,
          )
          .join("");
        const table = `<div class="section-title"><h4>Camp Patients</h4><span class="badge">${c.leads.length} Patients</span></div><div class="patient-wrapper"><table class="patient-table"><thead><tr>${["ID", "Camp ID", "Camp Name", "Date", "Name", "Age", "Gender", "Phone", "City", "Source", "Doctor", "Treatment", "Status", "Modified At", "Telesales Email"].map((h) => "<th>" + h + "</th>").join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
        return detailsShell(c, table);
      }

      loadData();
    </script>
  </body>
</html>
