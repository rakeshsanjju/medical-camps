<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Medical Camps Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            background: #f4f7fb;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        .login-wrapper {
            width: 100%;
        }


        .login-card {

            width: 100%;
            max-width: 430px;

            margin: auto;

            padding: 32px;

            background: #ffffff;

            border-radius: 16px;

            box-shadow:
                0 12px 35px
                rgba(15, 23, 42, 0.10);

        }


        .logo-wrapper {

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 8px;

        }


        .logo-wrapper img {

            width: 100%;
            max-width: 300px;

            height: auto;

            display: block;

        }


        h1 {

            margin:
                0
                0
                8px;

            text-align: center;

            font-size: 28px;

            color: #0f172a;

        }


        .subtitle {

            margin:
                0
                0
                28px;

            text-align: center;

            color: #64748b;

            font-size: 14px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;

        }


        input {

            width: 100%;

            margin-bottom: 16px;

            padding:
                13px
                14px;

            border:
                1px solid
                #cbd5e1;

            border-radius: 9px;

            outline: none;

            font-size: 15px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);

        }


        button {

            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 9px;

            background: #2563eb;

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s,
                opacity 0.2s;

        }


        button:hover:not(:disabled) {
            background: #1d4ed8;
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .secondary-btn {

            margin-top: 10px;

            background: #e2e8f0;

            color: #0f172a;

        }


        .secondary-btn:hover:not(:disabled) {
            background: #cbd5e1;
        }


        .text-btn {

            margin-top: 8px;

            background: transparent;

            color: #2563eb;

        }


        .text-btn:hover:not(:disabled) {

            background: #eff6ff;

        }


        .hidden {
            display: none;
        }


        .message {

            min-height: 20px;

            margin-top: 16px;

            text-align: center;

            font-size: 13px;

            line-height: 1.45;

        }


        .message.success {
            color: #15803d;
        }


        .message.error {
            color: #dc2626;
        }


        .message.info {
            color: #475569;
        }


        .otp-info {

            margin:
                0
                0
                18px;

            color: #64748b;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;

        }


        .otp-info strong {

            color: #0f172a;

            word-break: break-word;

        }


        #otp {

            text-align: center;

            letter-spacing: 6px;

            font-size: 20px;

            font-weight: 600;

        }


        @media screen and (max-width: 480px) {

            body {
                padding: 14px;
            }


            .login-card {

                padding:
                    24px
                    18px;

            }


            h1 {
                font-size: 24px;
            }


            .logo-wrapper img {
                max-width: 260px;
            }

        }

    </style>

</head>


<body>


<div class="login-wrapper">


    <div class="login-card">


        <!-- ==========================================
             LOGO
        =========================================== -->

        <div class="logo-wrapper">

            <img
                src="https://avisvascularcentre.com/assets/logo-1.png"
                alt="Avis Vascular Centre"
            >

        </div>


        <h1>
            Medical Camps
        </h1>


        <p class="subtitle">
            Login using your authorized email
        </p>



        <!-- ==========================================
             EMAIL STEP
        =========================================== -->

        <div id="emailStep">


            <label for="email">
                Email Address
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                autocomplete="email"
                spellcheck="false"
            >


            <button
                type="button"
                id="sendOtpBtn"
            >
                Send OTP
            </button>


        </div>



        <!-- ==========================================
             OTP STEP
        =========================================== -->

        <div
            id="otpStep"
            class="hidden"
        >


            <p class="otp-info">

                OTP sent to

                <br>

                <strong id="displayEmail"></strong>

            </p>


            <label for="otp">
                Enter OTP
            </label>


            <input
                type="text"
                id="otp"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="6-digit OTP"
            >


            <button
                type="button"
                id="verifyOtpBtn"
            >
                Verify OTP
            </button>


            <button
                type="button"
                id="resendOtpBtn"
                class="secondary-btn"
            >
                Resend OTP
            </button>


            <button
                type="button"
                id="changeEmailBtn"
                class="text-btn"
            >
                Change Email
            </button>


        </div>



        <!-- ==========================================
             MESSAGE
        =========================================== -->

        <div
            id="message"
            class="message"
            aria-live="polite"
        ></div>


    </div>


</div>



<script>


/* ==========================================
   BACKEND API
========================================== */

const API_BASE_URL =
    "https://medical-camps-production.up.railway.app";


/* ==========================================
   API ENDPOINTS
========================================== */

const API_ENDPOINTS = {

    sendOtp:
        `${API_BASE_URL}/api/auth/send-otp`,

    verifyOtp:
        `${API_BASE_URL}/api/auth/verify-otp`

};


/* ==========================================
   ELEMENTS
========================================== */

const emailStep =
    document.getElementById(
        "emailStep"
    );


const otpStep =
    document.getElementById(
        "otpStep"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const otpInput =
    document.getElementById(
        "otp"
    );


const sendOtpBtn =
    document.getElementById(
        "sendOtpBtn"
    );


const verifyOtpBtn =
    document.getElementById(
        "verifyOtpBtn"
    );


const resendOtpBtn =
    document.getElementById(
        "resendOtpBtn"
    );


const changeEmailBtn =
    document.getElementById(
        "changeEmailBtn"
    );


const displayEmail =
    document.getElementById(
        "displayEmail"
    );


const message =
    document.getElementById(
        "message"
    );


/* ==========================================
   APPLICATION STATE
========================================== */

let isSendingOtp =
    false;


let isVerifyingOtp =
    false;


/* ==========================================
   PAGE LOAD
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        checkExistingLogin();


        emailInput.focus();


    }
);


/* ==========================================
   CHECK EXISTING LOGIN
========================================== */

function checkExistingLogin() {


    const loggedIn =
        sessionStorage.getItem(
            "medical_logged_in"
        );


    const role =
        sessionStorage.getItem(
            "medical_user_role"
        );


    if (
        loggedIn !== "true"
    ) {

        return;

    }


    redirectByRole(
        role
    );

}


/* ==========================================
   SEND OTP BUTTON
========================================== */

sendOtpBtn.addEventListener(
    "click",
    function () {

        sendOtp(
            false
        );

    }
);


/* ==========================================
   RESEND OTP BUTTON
========================================== */

resendOtpBtn.addEventListener(
    "click",
    function () {

        sendOtp(
            true
        );

    }
);


/* ==========================================
   SEND / RESEND OTP
========================================== */

async function sendOtp(
    isResend = false
) {


    if (isSendingOtp) {

        return;

    }


    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    /* =====================================
       EMAIL REQUIRED
    ===================================== */

    if (!email) {


        showMessage(
            "Enter your email address.",
            "error"
        );


        emailInput.focus();


        return;

    }


    /* =====================================
       EMAIL FORMAT
    ===================================== */

    if (
        !validateEmail(
            email
        )
    ) {


        showMessage(
            "Enter a valid email address.",
            "error"
        );


        emailInput.focus();


        return;

    }


    /* =====================================
       START LOADING
    ===================================== */

    isSendingOtp =
        true;


    sendOtpBtn.disabled =
        true;


    resendOtpBtn.disabled =
        true;


    changeEmailBtn.disabled =
        true;


    if (isResend) {


        resendOtpBtn.textContent =
            "Resending...";


        showMessage(
            "Resending OTP...",
            "info"
        );


    } else {


        sendOtpBtn.textContent =
            "Sending...";


        showMessage(
            "Sending OTP...",
            "info"
        );

    }


    try {


        /* =====================================
           CALL BACKEND
        ===================================== */

        const response =
            await fetchWithTimeout(

                API_ENDPOINTS.sendOtp,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email

                        })

                },

                20000

            );


        /* =====================================
           READ RESPONSE
        ===================================== */

        const result =
            await parseJsonResponse(
                response
            );


        console.log(
            "SEND OTP STATUS:",
            response.status
        );


        console.log(
            "SEND OTP RESPONSE:",
            result
        );


        /* =====================================
           BACKEND ERROR
        ===================================== */

        if (
            !response.ok ||
            !result.success
        ) {


            throw new Error(

                result.message ||
                getHttpErrorMessage(
                    response.status
                )

            );

        }


        /* =====================================
           SUCCESS
        ===================================== */

        displayEmail.textContent =
            email;


        emailStep
            .classList
            .add(
                "hidden"
            );


        otpStep
            .classList
            .remove(
                "hidden"
            );


        otpInput.value =
            "";


        otpInput.focus();


        if (isResend) {


            showMessage(
                "A new OTP has been sent successfully.",
                "success"
            );


        } else {


            showMessage(
                result.message ||
                "OTP sent successfully.",
                "success"
            );

        }


    } catch (error) {


        console.error(
            "SEND OTP ERROR:",
            error
        );


        let errorMessage =
            error.message ||
            "Unable to send OTP.";


        if (
            error.name ===
            "AbortError"
        ) {


            errorMessage =
                "The server took too long to respond. Please try again.";

        }


        if (
            error instanceof TypeError &&
            error.message.includes(
                "fetch"
            )
        ) {


            errorMessage =
                "Unable to connect to the server. Please check your internet connection.";

        }


        showMessage(
            errorMessage,
            "error"
        );


    } finally {


        /* =====================================
           RESET BUTTONS
        ===================================== */

        isSendingOtp =
            false;


        sendOtpBtn.disabled =
            false;


        resendOtpBtn.disabled =
            false;


        changeEmailBtn.disabled =
            false;


        sendOtpBtn.textContent =
            "Send OTP";


        resendOtpBtn.textContent =
            "Resend OTP";


    }

}


/* ==========================================
   VERIFY OTP BUTTON
========================================== */

verifyOtpBtn.addEventListener(
    "click",
    verifyOtp
);


/* ==========================================
   VERIFY OTP
========================================== */

async function verifyOtp() {


    if (isVerifyingOtp) {

        return;

    }


    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    const otp =
        otpInput.value
            .trim();


    /* =====================================
       EMAIL REQUIRED
    ===================================== */

    if (!email) {


        showMessage(
            "Email address is missing. Please enter your email again.",
            "error"
        );


        showEmailStep();


        return;

    }


    /* =====================================
       VALID OTP
    ===================================== */

    if (
        !/^\d{6}$/.test(
            otp
        )
    ) {


        showMessage(
            "Enter a valid 6-digit OTP.",
            "error"
        );


        otpInput.focus();


        return;

    }


    /* =====================================
       START VERIFYING
    ===================================== */

    isVerifyingOtp =
        true;


    verifyOtpBtn.disabled =
        true;


    resendOtpBtn.disabled =
        true;


    changeEmailBtn.disabled =
        true;


    verifyOtpBtn.textContent =
        "Verifying...";


    showMessage(
        "Verifying OTP...",
        "info"
    );


    try {


        /* =====================================
           CALL BACKEND
        ===================================== */

        const response =
            await fetchWithTimeout(

                API_ENDPOINTS.verifyOtp,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            otp:
                                otp

                        })

                },

                20000

            );


        /* =====================================
           READ RESPONSE
        ===================================== */

        const result =
            await parseJsonResponse(
                response
            );


        console.log(
            "VERIFY OTP STATUS:",
            response.status
        );


        console.log(
            "VERIFY OTP RESPONSE:",
            result
        );


        /* =====================================
           BACKEND ERROR
        ===================================== */

        if (
            !response.ok ||
            !result.success
        ) {


            throw new Error(

                result.message ||
                getHttpErrorMessage(
                    response.status
                )

            );

        }


        /* =====================================
           VALIDATE ROLE
        ===================================== */

        const allowedRoles = [

            "campaigner",

            "counsellor",

            "admin"

        ];


        if (
            !allowedRoles.includes(
                result.role
            )
        ) {


            clearLogin();


            throw new Error(
                "Invalid user role returned by the server."
            );

        }


        /* =====================================
           SAVE LOGIN SESSION
        ===================================== */

        sessionStorage.setItem(
            "medical_logged_in",
            "true"
        );


        sessionStorage.setItem(
            "medical_user_email",
            email
        );


        sessionStorage.setItem(
            "medical_user_role",
            result.role
        );


        console.log(
            "LOGIN SUCCESS:",
            {
                email:
                    email,

                role:
                    result.role
            }
        );


        /* =====================================
           SUCCESS MESSAGE
        ===================================== */

        showMessage(
            result.message ||
            "Login successful.",
            "success"
        );


        /* =====================================
           REDIRECT
        ===================================== */

        setTimeout(
            function () {

                redirectByRole(
                    result.role
                );

            },
            300
        );


    } catch (error) {


        console.error(
            "VERIFY OTP ERROR:",
            error
        );


        let errorMessage =
            error.message ||
            "Unable to verify OTP.";


        if (
            error.name ===
            "AbortError"
        ) {


            errorMessage =
                "The server took too long to respond. Please try again.";

        }


        if (
            error instanceof TypeError &&
            error.message.includes(
                "fetch"
            )
        ) {


            errorMessage =
                "Unable to connect to the server. Please check your internet connection.";

        }


        showMessage(
            errorMessage,
            "error"
        );


        otpInput.focus();


    } finally {


        /* =====================================
           RESET VERIFY BUTTON
        ===================================== */

        isVerifyingOtp =
            false;


        verifyOtpBtn.disabled =
            false;


        resendOtpBtn.disabled =
            false;


        changeEmailBtn.disabled =
            false;


        verifyOtpBtn.textContent =
            "Verify OTP";


    }

}


/* ==========================================
   ROLE REDIRECTION
========================================== */

function redirectByRole(
    role
) {


    if (
        role ===
        "campaigner"
    ) {


        window.location.replace(
            "./dashboard.html"
        );


        return;

    }


    if (
        role ===
        "counsellor"
    ) {


        window.location.replace(
            "./counsellor.html"
        );


        return;

    }


    if (
        role ===
        "admin"
    ) {


        window.location.replace(
            "./admin-dashboard.html"
        );


        return;

    }


    /* Invalid saved role */

    clearLogin();

}


/* ==========================================
   CHANGE EMAIL
========================================== */

changeEmailBtn.addEventListener(
    "click",
    function () {


        showEmailStep();


        showMessage(
            "",
            ""
        );


    }
);


/* ==========================================
   SHOW EMAIL STEP
========================================== */

function showEmailStep() {


    otpStep
        .classList
        .add(
            "hidden"
        );


    emailStep
        .classList
        .remove(
            "hidden"
        );


    otpInput.value =
        "";


    emailInput.focus();

}


/* ==========================================
   OTP NUMBERS ONLY
========================================== */

otpInput.addEventListener(
    "input",
    function () {


        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    6
                );


    }
);


/* ==========================================
   EMAIL ENTER KEY
========================================== */

emailInput.addEventListener(
    "keydown",
    function (event) {


        if (
            event.key ===
            "Enter"
        ) {


            event.preventDefault();


            sendOtp(
                false
            );

        }


    }
);


/* ==========================================
   OTP ENTER KEY
========================================== */

otpInput.addEventListener(
    "keydown",
    function (event) {


        if (
            event.key ===
            "Enter"
        ) {


            event.preventDefault();


            verifyOtp();

        }


    }
);


/* ==========================================
   VALIDATE EMAIL
========================================== */

function validateEmail(
    email
) {


    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(
            email
        );

}


/* ==========================================
   FETCH WITH TIMEOUT
========================================== */

async function fetchWithTimeout(
    url,
    options = {},
    timeout = 20000
) {


    const controller =
        new AbortController();


    const timeoutId =
        setTimeout(
            function () {

                controller.abort();

            },
            timeout
        );


    try {


        const response =
            await fetch(

                url,

                {

                    ...options,

                    signal:
                        controller.signal

                }

            );


        return response;


    } finally {


        clearTimeout(
            timeoutId
        );


    }

}


/* ==========================================
   SAFE JSON RESPONSE
========================================== */

async function parseJsonResponse(
    response
) {


    const responseText =
        await response.text();


    if (!responseText) {


        return {

            success: false,

            message:
                `Server returned an empty response (${response.status}).`

        };

    }


    try {


        return JSON.parse(
            responseText
        );


    } catch (error) {


        console.error(
            "INVALID SERVER RESPONSE:",
            responseText
        );


        return {

            success: false,

            message:
                `Invalid response from server (${response.status}).`

        };

    }

}


/* ==========================================
   HTTP ERROR MESSAGE
========================================== */

function getHttpErrorMessage(
    status
) {


    switch (status) {


        case 400:

            return "Invalid request.";


        case 401:

            return "Authentication failed.";


        case 403:

            return "You don't have permission to access this dashboard.";


        case 404:

            return "Backend API endpoint was not found.";


        case 429:

            return "Too many attempts. Please wait and try again.";


        case 500:

            return "Server error. Unable to complete the request.";


        case 502:

        case 503:

        case 504:

            return "The server is temporarily unavailable. Please try again.";


        default:

            return `Request failed with status ${status}.`;

    }

}


/* ==========================================
   CLEAR LOGIN
========================================== */

function clearLogin() {


    sessionStorage.removeItem(
        "medical_logged_in"
    );


    sessionStorage.removeItem(
        "medical_user_email"
    );


    sessionStorage.removeItem(
        "medical_user_role"
    );

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    type
) {


    message.className =
        "message";


    if (type) {


        message.classList.add(
            type
        );

    }


    message.textContent =
        text;

}


</script>


</body>

</html>
