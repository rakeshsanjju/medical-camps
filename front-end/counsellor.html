        Counsellor Dashboard

    <script>

        function getAuthData() {

            return {

                loggedIn:
                    sessionStorage.getItem(
                        "medical_logged_in"
                    ),

                email:
                    sessionStorage.getItem(
                        "medical_user_email"
                    ),

                role:
                    sessionStorage.getItem(
                        "medical_user_role"
                    )

            };

        }


        function clearMedicalLogin() {

            sessionStorage.removeItem(
                "medical_logged_in"
            );

            sessionStorage.removeItem(
                "medical_user_email"
            );

            sessionStorage.removeItem(
                "medical_user_role"
            );

        }


        function requireCounsellor() {

            const auth =
                getAuthData();


            if (
                auth.loggedIn !== "true" ||
                auth.role !== "counsellor"
            ) {

                clearMedicalLogin();

                window.location.replace(
                    "./login.html"
                );

                return false;

            }


            return true;

        }


        function logoutMedicalUser() {

            clearMedicalLogin();

            window.location.replace(
                "./login.html"
            );

        }


        requireCounsellor();

    </script>

    <script>

        /* =========================================================
           APIs
        ========================================================= */

        const LEADS_API_URL =
            "https://script.google.com/macros/s/AKfycbz1pRQuuOg8niURZ-oObllLAacDWSIXs20pUu19r6p8mtrRCeSXmtN9B7Bl6hd0D81V4Q/exec";


        const CAMPS_API_URL =
            "https://script.google.com/macros/s/AKfycbwdfXWbuvA9K8P5V76hFzGH9WrerBIkz2Uhm2T7OJRG1hmqJf0ElXcWmIvqn78neNSIZw/exec";


        /* =========================================================
           USER
        ========================================================= */

        const currentUser =
            getAuthData();


        const currentEmail =
            String(
                currentUser.email || ""
            )
                .trim()
                .toLowerCase();


        document
            .getElementById(
                "userEmail"
            )
            .textContent =
            currentEmail;


        /* =========================================================
           DATA
        ========================================================= */

        let assignedCamps = [];

        let selectedCamp = null;

        let allLeads = [];


        /* =========================================================
           LOAD CAMPS
        ========================================================= */

        async function loadAssignedCamps() {

            try {

                const response =
                    await fetch(

                        CAMPS_API_URL +
                        "?action=getCamps&t=" +
                        Date.now(),

                        {
                            cache:
                                "no-store"
                        }

                    );


                const result =
                    await response.json();


                if (!result.success) {

                    throw new Error(
                        result.message
                    );

                }


                assignedCamps =
                    (
                        Array.isArray(
                            result.camps
                        )
                            ? result.camps
                            : []
                    )
                        .filter(
                            function (camp) {

                                return (

                                    String(
                                        camp.counsellor || ""
                                    )
                                        .trim()
                                        .toLowerCase()

                                    ===

                                    currentEmail

                                );

                            }
                        );


                renderCampSelector();


            } catch (error) {

                document
                    .getElementById(
                        "campError"
                    )
                    .textContent =
                    error.message;

            }

        }


        /* =========================================================
           CAMP SELECTOR
        ========================================================= */

        function renderCampSelector() {

            const selector =
                document.getElementById(
                    "campSelector"
                );


            if (
                assignedCamps.length === 0
            ) {

                selector.innerHTML = `

            <option value="">
                No camp assigned
            </option>

        `;


                renderTable([]);


                return;

            }


            selector.innerHTML =
                assignedCamps
                    .map(
                        function (camp) {

                            return `

                        <option
                            value="${escapeHtml(
                                camp.id
                            )}"
                        >

                            ${escapeHtml(
                                camp.id
                            )}

                            -

                            ${escapeHtml(
                                camp.campName
                            )}

                        </option>

                    `;

                        }
                    )
                    .join("");


            selectCamp(
                assignedCamps[0].id
            );

        }


        /* =========================================================
           SELECT CAMP
        ========================================================= */

        document
            .getElementById(
                "campSelector"
            )
            .addEventListener(
                "change",
                function () {

                    selectCamp(
                        this.value
                    );

                }
            );


        function selectCamp(
            id
        ) {

            selectedCamp =
                assignedCamps.find(
                    function (camp) {

                        return (
                            String(
                                camp.id
                            )
                            ===
                            String(
                                id
                            )
                        );

                    }
                ) || null;


            if (!selectedCamp) {

                return;

            }


            document
                .getElementById(
                    "campDetails"
                )
                .innerHTML = `

            <strong>

                ${escapeHtml(
                    selectedCamp.campName
                )}

            </strong>

            &nbsp; | &nbsp;

            ${escapeHtml(
                    selectedCamp.city
                )}

            &nbsp; | &nbsp;

            Doctor:

            ${escapeHtml(
                    selectedCamp.doctorName
                )}

        `;


            loadLeads();

        }


        /* =========================================================
           LOAD LEADS
        ========================================================= */

        async function loadLeads() {

            if (!selectedCamp) {

                renderTable([]);

                return;

            }


            try {

                const response =
                    await fetch(

                        LEADS_API_URL +
                        "?action=getLeads&t=" +
                        Date.now(),

                        {
                            cache:
                                "no-store"
                        }

                    );


                const result =
                    await response.json();


                if (!result.success) {

                    throw new Error(
                        result.message
                    );

                }


                allLeads =
                    (
                        Array.isArray(
                            result.leads
                        )
                            ? result.leads
                            : []
                    )
                        .filter(
                            function (lead) {

                                return (

                                    String(
                                        lead.campId || ""
                                    )
                                        .trim()

                                    ===

                                    String(
                                        selectedCamp.id
                                    )
                                        .trim()

                                );

                            }
                        );


                renderTable(
                    allLeads
                );


            } catch (error) {

                document
                    .getElementById(
                        "leadTableBody"
                    )
                    .innerHTML = `

                <tr>

                    <td colspan="13">

                        ${escapeHtml(
                        error.message
                    )}

                    </td>

                </tr>

            `;

            }

        }


        /* =========================================================
           RENDER
        ========================================================= */

        function renderTable(
            leads
        ) {

            const body =
                document.getElementById(
                    "leadTableBody"
                );


            if (!leads.length) {

                body.innerHTML = `

            <tr>

                <td colspan="13">

                    No patient data for this camp.

                </td>

            </tr>

        `;

                return;

            }


            body.innerHTML =
                leads
                    .map(
                        function (lead) {

                            return `

                        <tr>

                            <td>
                                ${escapeHtml(
                                lead.id
                            )}
                            </td>

                            <td>

                                ${escapeHtml(
                                lead.campId
                            )}

                                -

                                ${escapeHtml(
                                lead.campName
                            )}

                            </td>

                            <td>
                                ${escapeHtml(
                                lead.date
                            )}
                            </td>

                            <td>
                                ${escapeHtml(
                                lead.name
                            )}
                            </td>

                            <td>
                                ${escapeHtml(
                                lead.age
                            )}
                            </td>

                            <td>
                                ${escapeHtml(
                                lead.gender
                            )}
                            </td>

                            <td>
                                ${escapeHtml(
                                lead.mobile
                            )}
                            </td>

                            <td>
                                ${escapeHtml(
                                lead.city
                            )}
                            </td>

                            <td>
                                ${displayValue(
                                lead.source
                            )}
                            </td>

                            <td>
                                ${displayValue(
                                lead.doctorName
                            )}
                            </td>

                            <td>
                                ${displayValue(
                                lead.treatment
                            )}
                            </td>

                            <td>
                                ${displayValue(
                                lead.status
                            )}
                            </td>

                            <td>

                                <button
                                    type="button"
                                    class="edit-btn"
                                    onclick="
                                        openEditPopup(
                                            '${escapeHtml(
                                lead.id
                            )}'
                                        )
                                    "
                                >
                                    Edit
                                </button>

                            </td>

                        </tr>

                    `;

                        }
                    )
                    .join("");

        }


        /* =========================================================
           EDIT
        ========================================================= */

        function openEditPopup(
            id
        ) {

            const lead =
                allLeads.find(
                    function (item) {

                        return (
                            String(
                                item.id
                            )
                            ===
                            String(
                                id
                            )
                        );

                    }
                );


            if (!lead) {

                return;

            }


            document
                .getElementById(
                    "editId"
                )
                .value =
                lead.id || "";


            document
                .getElementById(
                    "editDate"
                )
                .value =
                lead.date || "";


            document
                .getElementById(
                    "editName"
                )
                .value =
                lead.name || "";


            document
                .getElementById(
                    "editAge"
                )
                .value =
                lead.age || "";


            document
                .getElementById(
                    "editGender"
                )
                .value =
                lead.gender || "";


            document
                .getElementById(
                    "editMobile"
                )
                .value =
                lead.mobile || "";


            document
                .getElementById(
                    "editCity"
                )
                .value =
                lead.city || "";


            document
                .getElementById(
                    "editDoctorName"
                )
                .value =
                editableValue(
                    lead.doctorName
                );


            document
                .getElementById(
                    "editTreatment"
                )
                .value =
                editableValue(
                    lead.treatment
                );


            updateStatusOptions(
                editableValue(
                    lead.status
                )
            );


            document
                .getElementById(
                    "editPopup"
                )
                .classList
                .add(
                    "active"
                );

        }


        /* =========================================================
           STATUS
        ========================================================= */

        function updateStatusOptions(
            selectedStatus = ""
        ) {

            const treatment =
                document
                    .getElementById(
                        "editTreatment"
                    )
                    .value;


            const status =
                document
                    .getElementById(
                        "editStatus"
                    );


            let options = [];


            if (
                treatment ===
                "Varicose Veins"
            ) {

                options = [

                    "Bilateral",

                    "Unilateral"

                ];

            }


            else if (
                treatment ===
                "Not Varicose Veins"
            ) {

                options = [

                    "Stockings"

                ];

            }


            else if (
                treatment ===
                "Medicines"
            ) {

                options = [

                    "Medicines"

                ];

            }


            else if (
                treatment ===
                "None"
            ) {

                options = [

                    "None"

                ];

            }


            status.innerHTML = `

        <option value="">
            Select Status
        </option>

    `;


            options.forEach(
                function (value) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        value;


                    option.textContent =
                        value;


                    status.appendChild(
                        option
                    );

                }
            );


            if (
                selectedStatus
            ) {

                status.value =
                    selectedStatus;

            }

        }


        /* =========================================================
           SAVE COUNSELLOR UPDATE
        ========================================================= */

        document
            .getElementById(
                "editForm"
            )
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const data = {

                        action:
                            "updateCounsellorLead",

                        id:
                            document
                                .getElementById(
                                    "editId"
                                )
                                .value
                                .trim(),

                        date:
                            document
                                .getElementById(
                                    "editDate"
                                )
                                .value
                                .trim(),

                        name:
                            document
                                .getElementById(
                                    "editName"
                                )
                                .value
                                .trim(),

                        age:
                            document
                                .getElementById(
                                    "editAge"
                                )
                                .value
                                .trim(),

                        gender:
                            document
                                .getElementById(
                                    "editGender"
                                )
                                .value,

                        mobile:
                            document
                                .getElementById(
                                    "editMobile"
                                )
                                .value
                                .trim(),

                        city:
                            document
                                .getElementById(
                                    "editCity"
                                )
                                .value
                                .trim(),

                        doctorName:
                            document
                                .getElementById(
                                    "editDoctorName"
                                )
                                .value
                                .trim(),

                        treatment:
                            document
                                .getElementById(
                                    "editTreatment"
                                )
                                .value,

                        status:
                            document
                                .getElementById(
                                    "editStatus"
                                )
                                .value,

                        campId:
                            selectedCamp
                                ? selectedCamp.id
                                : "",

                        counsellorEmail:
                            currentEmail

                    };


                    const button =
                        document.getElementById(
                            "updateButton"
                        );


                    button.disabled =
                        true;


                    button.textContent =
                        "Updating...";


                    try {

                        const response =
                            await fetch(

                                LEADS_API_URL,

                                {

                                    method:
                                        "POST",

                                    headers: {

                                        "Content-Type":
                                            "text/plain;charset=utf-8"

                                    },

                                    body:
                                        JSON.stringify(
                                            data
                                        )

                                }

                            );


                        const result =
                            await response.json();


                        console.log(
                            "COUNSELLOR UPDATE:",
                            result
                        );


                        if (!result.success) {

                            throw new Error(
                                result.message
                            );

                        }


                        showMessage(
                            "Patient updated successfully.",
                            "success"
                        );


                        await loadLeads();


                        setTimeout(
                            function () {

                                document
                                    .getElementById(
                                        "editPopup"
                                    )
                                    .classList
                                    .remove(
                                        "active"
                                    );

                            },
                            600
                        );


                    } catch (error) {

                        showMessage(
                            error.message,
                            "error"
                        );

                    } finally {

                        button.disabled =
                            false;


                        button.textContent =
                            "Update Patient";

                    }

                }
            );


        /* =========================================================
           CLOSE
        ========================================================= */

        document
            .getElementById(
                "closePopup"
            )
            .addEventListener(
                "click",
                function () {

                    document
                        .getElementById(
                            "editPopup"
                        )
                        .classList
                        .remove(
                            "active"
                        );

                }
            );


        /* =========================================================
           SEARCH
        ========================================================= */

        document
            .getElementById(
                "leadSearch"
            )
            .addEventListener(
                "input",
                function () {

                    const keyword =
                        this.value
                            .trim()
                            .toLowerCase();


                    if (!keyword) {

                        renderTable(
                            allLeads
                        );

                        return;

                    }


                    const filtered =
                        allLeads.filter(
                            function (lead) {

                                return [

                                    lead.id,

                                    lead.name,

                                    lead.mobile,

                                    lead.city,

                                    lead.source,

                                    lead.doctorName,

                                    lead.treatment,

                                    lead.status

                                ]
                                    .join(" ")
                                    .toLowerCase()
                                    .includes(
                                        keyword
                                    );

                            }
                        );


                    renderTable(
                        filtered
                    );

                }
            );


        /* =========================================================
           HELPERS
        ========================================================= */

        function displayValue(
            value
        ) {

            const text =
                String(
                    value || ""
                )
                    .trim();


            return (
                !text ||
                text === "-"
            )
                ? "-"
                : escapeHtml(
                    text
                );

        }


        function editableValue(
            value
        ) {

            const text =
                String(
                    value || ""
                )
                    .trim();


            return (
                !text ||
                text === "-"
            )
                ? ""
                : text;

        }


        function showMessage(
            text,
            type
        ) {

            const element =
                document.getElementById(
                    "formMessage"
                );


            element.className =
                "message " +
                type;


            element.textContent =
                text;

        }


        function escapeHtml(
            value
        ) {

            return String(
                value == null
                    ? ""
                    : value
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* =========================================================
           START
        ========================================================= */

        loadAssignedCamps();

    </script>


</body>

</html>
