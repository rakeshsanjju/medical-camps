<script>
function getAuthData() {
    return {
        loggedIn: sessionStorage.getItem("medical_logged_in"),
        email: sessionStorage.getItem("medical_user_email"),
        role: sessionStorage.getItem("medical_user_role")
    };
}

function clearMedicalLogin() {
    sessionStorage.removeItem("medical_logged_in");
    sessionStorage.removeItem("medical_user_email");
    sessionStorage.removeItem("medical_user_role");
}

function requireAdmin() {
    const auth = getAuthData();

    if (auth.loggedIn !== "true" || auth.role !== "admin") {
        clearMedicalLogin();
        window.location.replace("./login.html");
        return false;
    }

    return true;
}

function logoutMedicalUser() {
    clearMedicalLogin();
    window.location.replace("./login.html");
}

requireAdmin();
</script>

<script>
/* =========================================================
   URLS / API ACTIONS
========================================================= */

const LEADS_API_URL =
    "https://script.google.com/macros/s/AKfycbwaY7WhanDFXtLn4PkSym_BmT_oGnea4-Ckm30wyJDkO6odi4f2HP-4YB07aPQEGd3t0Q/exec";

const CAMPS_API_URL =
    "https://script.google.com/macros/s/AKfycbw4w8S_nHPcdn3RWj-wm2XGT_6Il70lScUQFP71UooBPM7Npf0zedq_Vf2-4TdIBtTD1w/exec";

/*
   Existing lead-fetch action from your current code.
   We call it once for EACH camp so the UI is camp-wise instead of
   counsellor-wise.
*/
const GET_CAMP_PATIENTS_ACTION = "getCounsellorLeads";

/*
   Google is the source of truth.

   convertToIp:
   - finds the lead by ID in the Google "Leads" sheet
   - writes Conversion Status = Converted
   - writes Converted Time
   - does NOT overwrite the existing clinical Status column

   getIpData:
   - returns ONLY rows whose Conversion Status is Converted
*/
const CONVERT_TO_IP_ACTION = "convertToIp";
const GET_IP_DATA_ACTION = "getIpData";
const GET_ALL_LEADS_ACTION = "getLeads";
const GET_TELESALES_FOLLOWUPS_ACTION = "getTelesalesFollowups";


/* =========================================================
   ADMIN
========================================================= */

const auth = getAuthData();

document.getElementById("adminEmail").textContent =
    auth.email || "Admin";


/* =========================================================
   DATA
========================================================= */

let allCamps = [];
let allLeads = [];


/* =========================================================
   FETCH HELPER
========================================================= */

async function fetchJson(url, options = {}) {
    const response = await fetch(url, {
        cache: "no-store",
        ...options
    });

    const text = await response.text();

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    if (text.trim().startsWith("<")) {
        throw new Error("API returned HTML instead of JSON.");
    }

    try {
        return JSON.parse(text);
    } catch (error) {
        throw new Error("API returned invalid JSON.");
    }
}


/* =========================================================
   LOAD CAMP-WISE OP DATA
========================================================= */

async function loadData() {
    const tableBody = document.getElementById("tableBody");
    const loadNote = document.getElementById("loadNote");

    tableBody.innerHTML = `
        <tr>
            <td colspan="5" class="empty">Loading OP data...</td>
        </tr>
    `;

    loadNote.textContent = "";

    try {
        const campResult = await fetchJson(
            CAMPS_API_URL +
            "?action=getCamps&t=" +
            Date.now()
        );

        if (!campResult.success) {
            throw new Error(
                campResult.message || "Unable to load camps."
            );
        }

        const rawCamps = Array.isArray(campResult.camps)
            ? campResult.camps
            : [];

        allCamps = rawCamps.map(function(camp) {
            return {
                ...camp,
                leads: [],
                loadError: ""
            };
        });

        /*
           IMPORTANT CHANGE:
           Earlier the code grouped camps by counsellor and then fetched
           counsellor-wide patients. Now each camp fetches only its own data.

           This means if a camp has 49 patients and the API returns all 49,
           View Details will render all 49 rows.
        */
        const results = await Promise.allSettled(
            allCamps.map(async function(camp) {
                const campId = String(camp.id || "").trim();
                const counsellorEmail = normalizeEmail(camp.counsellor);

                if (!campId) {
                    return {
                        camp: camp,
                        leads: []
                    };
                }

                const url =
                    LEADS_API_URL +
                    "?action=" +
                    encodeURIComponent(GET_CAMP_PATIENTS_ACTION) +
                    "&campIds=" +
                    encodeURIComponent(campId) +
                    "&counsellorEmail=" +
                    encodeURIComponent(counsellorEmail) +
                    "&t=" +
                    Date.now();

                const result = await fetchJson(url);

                if (!result.success) {
                    throw new Error(
                        result.message ||
                        "Unable to load patients for camp " + campId
                    );
                }

                return {
                    camp: camp,
                    leads: deduplicateLeads(
                        Array.isArray(result.leads)
                            ? result.leads
                            : []
                    )
                };
            })
        );

        let failedCampLoads = 0;

        results.forEach(function(result, index) {
            if (result.status === "fulfilled") {
                allCamps[index].leads = result.value.leads;
                allCamps[index].loadError = "";
            } else {
                failedCampLoads += 1;
                allCamps[index].leads = [];
                allCamps[index].loadError =
                    result.reason && result.reason.message
                        ? result.reason.message
                        : "Unable to load patient data.";

                console.error(
                    "Camp patient load failed:",
                    allCamps[index].id,
                    result.reason
                );
            }
        });

        await mergeGoogleConversionState();
        await mergeGoogleTelesalesFollowupState();
        buildGlobalLeadList();
        renderCamps(allCamps);
        updateStats();

        if (failedCampLoads > 0) {
            loadNote.textContent =
                failedCampLoads +
                " camp(s) could not load patient data. Open the affected camp row to see the error.";
        }

    } catch (error) {
        console.error(error);

        tableBody.innerHTML = `
            <tr>
                <td colspan="5" class="error">
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;
    }
}


/* =========================================================
   DEDUPLICATE PATIENTS
========================================================= */

function deduplicateLeads(leads) {
    const map = new Map();

    leads.forEach(function(lead, index) {
        const key = getLeadKey(lead, index);

        if (!map.has(key)) {
            map.set(key, lead);
        }
    });

    return Array.from(map.values());
}


/* =========================================================
   GLOBAL PATIENT LIST FOR STATS
========================================================= */

function buildGlobalLeadList() {
    const map = new Map();

    allCamps.forEach(function(camp) {
        camp.leads.forEach(function(lead, index) {
            const key = getLeadKey(lead, index);

            if (!map.has(key)) {
                map.set(key, lead);
            }
        });
    });

    allLeads = Array.from(map.values());
}


/* =========================================================
   MAIN CAMP TABLE
========================================================= */

function renderCamps(records) {
    const body = document.getElementById("tableBody");

    if (!records.length) {
        body.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    No camp data found.
                </td>
            </tr>
        `;

        return;
    }

    body.innerHTML = records
        .map(function(camp, index) {
            const rowId = "camp_" + index + "_" + Date.now();
            const campId = String(camp.id || "").trim();

            return `
                <tr>
                    <td class="camp-main-id">
                        ${display(campId)}
                    </td>

                    <td class="camp-details-main">
                        <strong>${display(camp.campName)}</strong>
                        <span>Date: ${display(camp.campDate)}</span>
                        <span>City: ${display(camp.city)}</span>
                        <span>Doctor: ${display(camp.doctorName)}</span>
                    </td>

                    <td class="patient-count">
                        ${camp.leads.length}
                    </td>

                    <td>
                        ${escapeHtml(getLastModified(camp.leads))}
                    </td>

                    <td>
                        <button
                            class="view-btn"
                            data-row-id="${escapeAttribute(rowId)}"
                            data-camp-id="${escapeAttribute(campId)}"
                            onclick="showCamp(this)"
                        >
                            View Details
                        </button>
                    </td>
                </tr>

                <tr
                    id="${escapeAttribute(rowId)}"
                    class="expand-row"
                >
                    <td colspan="5" class="expand-cell">
                        <div
                            id="${escapeAttribute(rowId)}_content"
                            class="panel"
                        ></div>

/* =========================================================
   CONVERT PATIENT TO IP
   IMPORTANT:
   The UI changes to "Converted" ONLY after Google Sheet
   confirms that the row was updated successfully.
========================================================= */

async function convertPatient(button) {
    const campId = String(button.dataset.campId || "").trim();
    const leadKey = String(button.dataset.leadKey || "").trim();

    const camp = findCampById(campId);

    if (!camp) {
        alert("Camp not found.");
        return;
    }

    const lead = findLeadByKey(camp, leadKey);

    if (!lead) {
        alert("Patient record not found.");
        return;
    }

    const leadId = String(lead.id || "").trim();

    if (!leadId) {
        alert("Patient ID is missing. Cannot convert this record.");
        return;
    }

    if (isConvertedLead(lead)) {
        alert("This patient is already converted to IP.");
        return;
    }

    const patientName = String(lead.name || "this patient").trim();

    const confirmed = window.confirm(
        "Convert " + patientName + " to IP?"
    );

    if (!confirmed) {
        return;
    }

    const oldText = button.textContent;

    button.disabled = true;
    button.classList.add("is-loading");
    button.textContent = "Converting...";

    try {
        const clientConvertedAt = new Date().toISOString();

        const params = new URLSearchParams({
            action: CONVERT_TO_IP_ACTION,
            leadId: leadId,
            id: leadId,
            campId: String(camp.id || lead.campId || ""),
            convertedAt: clientConvertedAt,
            t: String(Date.now())
        });

        const result = await fetchJson(
            LEADS_API_URL + "?" + params.toString()
        );

        if (!result || !result.success) {
            throw new Error(
                result && result.message
                    ? result.message
                    : "Google Sheet conversion failed."
            );
        }

        const savedConvertedAt =
            result.convertedAt ||
            result.convertedTime ||
            clientConvertedAt;

        /*
           Preserve the original lead.status because your Google sheet's
           Status column contains clinical values such as Bilateral /
           Unilateral. Conversion is stored separately in
           "Conversion Status".
        */
        lead.converted = true;
        lead.opConverted = true;
        lead.ipConverted = true;
        lead.conversionStatus =
            result.conversionStatus ||
            result.ipStatus ||
            "Converted";
        lead.convertedAt = savedConvertedAt;
        lead.convertedTime = savedConvertedAt;
        lead.ipConvertedAt = savedConvertedAt;

        const currentRow = button.closest("tr");

        if (currentRow) {
            const convertedTimeCell =
                currentRow.querySelector(".converted-time");

            if (convertedTimeCell) {
                convertedTimeCell.textContent =
                    formatConvertedTime(savedConvertedAt);
            }
        }

        button.outerHTML =
            '<span class="converted-text">Converted</span>';

    } catch (error) {
        console.error(error);

        button.disabled = false;
        button.classList.remove("is-loading");
        button.textContent = oldText;

        alert(
            "Convert failed. Nothing was marked as converted locally.\n\n" +
            error.message
        );
    }
}

/* =========================================================
   LAST MODIFIED
========================================================= */

function getLastModified(leads) {
    if (!leads.length) {
        return "-";
    }

    const values = leads
        .map(function(lead) {
            return String(
                lead.telesalesFollowupAt ||
                lead.followupUpdatedAt ||
                lead.lastFollowupAt ||
                lead.counsellorUpdatedAt ||
                lead.updatedAt ||
                lead.modifiedAt ||
                lead.date ||
                ""
            ).trim();
        })
        .filter(Boolean);

    if (!values.length) {
        return "-";
    }

    /*
       Keep compatibility with your original data format.
       If the API returns parseable dates, use the newest date.
       Otherwise show the first non-empty value.
    */
    const parseable = values
        .map(function(value) {
            return {
                value: value,
                time: Date.parse(value)
            };
        })
        .filter(function(item) {
            return !Number.isNaN(item.time);
        })
        .sort(function(a, b) {
            return b.time - a.time;
        });

    return parseable.length
        ? parseable[0].value
        : values[0];
}

/* =========================================================
   FINDERS / KEYS
========================================================= */

function findCampById(campId) {
    const target = String(campId || "").trim();

    return allCamps.find(function(camp) {
        return String(camp.id || "").trim() === target;
    });
}

function getLeadKey(lead, fallbackIndex) {
    const id = String(lead.id || "").trim();

    if (id) {
        return "id:" + id;
    }

    return (
        "fallback:" +
        [
            lead.mobile || "",
            lead.date || "",
            lead.name || "",
            fallbackIndex == null ? "" : fallbackIndex
        ].join("|")
    );
}

function findLeadByKey(camp, leadKey) {
    return camp.leads.find(function(lead, index) {
        return getLeadKey(lead, index) === leadKey;
    });
}

function isConvertedLead(lead) {
    if (
        lead.converted === true ||
        lead.opConverted === true ||
        lead.ipConverted === true ||
        Boolean(getConvertedTime(lead))
    ) {
        return true;
    }

    const conversionStatus = String(
        lead.conversionStatus ||
        lead.ipStatus ||
        ""
    )
        .trim()
        .toLowerCase();

    return conversionStatus === "converted";
}


/* =========================================================
   MERGE CONVERSION STATE FROM GOOGLE

   OP data itself still comes from your existing camp/lead APIs.
   This extra call asks Google for the IP list (converted rows only)
   and marks matching OP leads as already converted after refresh.
========================================================= */

async function mergeGoogleConversionState() {
    try {
        const result = await fetchJson(
            LEADS_API_URL +
            "?action=" +
            encodeURIComponent(GET_IP_DATA_ACTION) +
            "&t=" +
            Date.now()
        );

        if (!result || !result.success) {
            throw new Error(
                result && result.message
                    ? result.message
                    : "Unable to read converted records."
            );
        }

        const records = Array.isArray(result.records)
            ? result.records
            : Array.isArray(result.leads)
                ? result.leads
                : Array.isArray(result.data)
                    ? result.data
                    : [];

        const map = new Map();

        records.forEach(function(record) {
            const id = String(
                record.id ||
                record.leadId ||
                ""
            ).trim();

            if (id) {
                map.set(id, record);
            }
        });

        allCamps.forEach(function(camp) {
            camp.leads.forEach(function(lead) {
                const id = String(lead.id || "").trim();
                const record = id ? map.get(id) : null;

                if (!record) {
                    return;
                }

                lead.converted = true;
                lead.opConverted = true;
                lead.ipConverted = true;
                lead.conversionStatus =
                    record.conversionStatus ||
                    record.ipStatus ||
                    "Converted";

                lead.convertedAt =
                    record.convertedAt ||
                    record.convertedTime ||
                    "";

                lead.convertedTime =
                    record.convertedTime ||
                    record.convertedAt ||
                    "";

                lead.ipConvertedAt =
                    record.convertedAt ||
                    record.convertedTime ||
                    "";
            });
        });

    } catch (error) {
        console.warn(
            "Could not merge converted records from Google:",
            error
        );
    }
}

/* =========================================================
   TELESALES FOLLOW-UP DISPLAY HELPERS
========================================================= */

function getFollowupStatus(lead) {
    return (
        lead.telesalesFollowupStatus ||
        lead.followupStatus ||
        "Pending"
    );
}


function getNextFollowupDate(lead) {
    return (
        lead.telesalesNextFollowupDate ||
        lead.nextFollowupDate ||
        ""
    );
}


function getFollowupRemarks(lead) {
    return (
        lead.telesalesRemarks ||
        lead.followupRemarks ||
        ""
    );
}


function getLastFollowupAt(lead) {
    return (
        lead.telesalesFollowupAt ||
        lead.followupUpdatedAt ||
        lead.lastFollowupAt ||
        ""
    );
}


function getFollowupStatusClass(value) {
    const status = String(value || "Pending")
        .trim()
        .toLowerCase();

    if (!status) {
        return "pending";
    }

    return status
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") ||
        "pending";
}


function formatFollowupTime(value) {
    const text = String(value == null ? "" : value).trim();

    if (!text) {
        return "-";
    }

    /*
       Google Apps Script stores the value as:
       dd-MM-yyyy HH:mm:ss
       If it is already in that format, display it as-is.
    */
    if (
        /^\d{1,2}-\d{1,2}-\d{4}\s+\d{1,2}:\d{2}:\d{2}$/
            .test(text)
    ) {
        return text;
    }

    const date = new Date(text);

    if (Number.isNaN(date.getTime())) {
        return text;
    }

    return date.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    });
}

                        <th>Remarks</th>
                        <th>Follow-up At</th>
                    </tr>
                </thead>

                <tbody>
                    ${rows}
                </tbody>
            </table>
        </div>
    `;
}


function closeFollowupHistory() {
    const modal =
        document.getElementById("followupHistoryModal");

    modal.classList.remove("active");
}


function handleHistoryModalBackdrop(event) {
    if (
        event.target &&
        event.target.id ===
        "followupHistoryModal"
    ) {
        closeFollowupHistory();
    }
}


document.addEventListener(
    "keydown",
    function(event) {
        if (
            event.key ===
            "Escape"
        ) {
            closeFollowupHistory();
        }
    }
);


/* =========================================================
   CONVERTED TIME
========================================================= */

function getConvertedTime(lead) {
    return (
        lead.convertedAt ||
        lead.convertedTime ||
        lead.ipConvertedAt ||
        lead.opConvertedAt ||
        ""
    );
}

function formatConvertedTime(value) {
    const text = String(value == null ? "" : value).trim();

    if (!text) {
        return "-";
    }

    const date = new Date(text);

    if (Number.isNaN(date.getTime())) {
        return text;
    }

    return date.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    });
}

/* =========================================================
   HELPERS
========================================================= */

function normalizeEmail(value) {
    return String(value == null ? "" : value)
        .trim()
        .toLowerCase();
}

function display(value) {
    const text = String(value == null ? "" : value).trim();

    if (!text || text === "-") {
        return "-";
    }

    return escapeHtml(text);
}

function escapeHtml(value) {
    return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
    return escapeHtml(value);
}

function escapeJsString(value) {
    return String(value == null ? "" : value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");
}

========================================================= */

loadData();
