<!-- ======================================================
     ADMIN AUTH
====================================================== -->

<script>

function getAuthData() {

    return {

        loggedIn:
            sessionStorage.getItem(
                "medical_logged_in"
            ),

        email:
            sessionStorage.getItem(
                "medical_user_email"
            ),

        role:
            sessionStorage.getItem(
                "medical_user_role"
            )

    };

}


function clearMedicalLogin() {

    sessionStorage.removeItem(
        "medical_logged_in"
    );

    sessionStorage.removeItem(
        "medical_user_email"
    );

    sessionStorage.removeItem(
        "medical_user_role"
    );

}


function requireAdmin() {

    const auth =
        getAuthData();


    if (
        auth.loggedIn !== "true" ||
        auth.role !== "admin"
    ) {

        clearMedicalLogin();

        window.location.replace(
            "./login.html"
        );

        return false;

    }


    return true;

}


function logoutMedicalUser() {

    clearMedicalLogin();

    window.location.replace(
        "./login.html"
    );

}


requireAdmin();

</script>

<script>

/* ======================================================
   API URLS
====================================================== */

/*
 * CAMP API
 */

const CAMPS_API_URL =
    "https://script.google.com/macros/s/AKfycbwdfXWbuvA9K8P5V76hFzGH9WrerBIkz2Uhm2T7OJRG1hmqJf0ElXcWmIvqn78neNSIZw/exec";

const LEADS_API_URL =
    "https://script.google.com/macros/s/AKfycbz1pRQuuOg8niURZ-oObllLAacDWSIXs20pUu19r6p8mtrRCeSXmtN9B7Bl6hd0D81V4Q/exec";



/* ======================================================
   ELEMENTS
====================================================== */

const campTableBody =
    document.getElementById(
        "campTableBody"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


const totalCampsElement =
    document.getElementById(
        "totalCamps"
    );


const upcomingCampsElement =
    document.getElementById(
        "upcomingCamps"
    );



/* ======================================================
   DATA
====================================================== */

let allCamps = [];

let allLeads = [];

let leadsLoaded = false;

let openCampId = null;



/* ======================================================
   ADMIN EMAIL
====================================================== */

const auth =
    getAuthData();


document
    .getElementById(
        "adminEmail"
    )
    .textContent =
        auth.email ||
        "Admin";



/* ======================================================
   LOAD CAMPS
====================================================== */

async function loadCamps() {


    campTableBody.innerHTML = `

        <tr>

            <td
                colspan="10"
                class="empty-message"
            >
                Loading camps...
            </td>

        </tr>

    `;


    try {


        const response =
            await fetch(

                CAMPS_API_URL +
                "?action=getCamps&t=" +
                Date.now(),

                {

                    method:
                        "GET",

                    cache:
                        "no-store"

                }

            );


        if (!response.ok) {

            throw new Error(
                "Unable to connect to camp database."
            );

        }


        const result =
            await response.json();


        console.log(
            "GET CAMPS:",
            result
        );


        if (!result.success) {

            throw new Error(

                result.message ||
                "Unable to load camps."

            );

        }


        allCamps =
            Array.isArray(
                result.camps
            )
                ? result.camps
                : [];


        renderCamps(
            allCamps
        );


        updateStatistics();


    } catch (error) {


        console.error(
            "LOAD CAMPS ERROR:",
            error
        );


        campTableBody.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="error-message"
                >
                    ${escapeHtml(
                        error.message ||
                        "Unable to load camps."
                    )}
                </td>

            </tr>

        `;


    }


}



/* ======================================================
   LOAD ALL PATIENT / LEAD DATA
====================================================== */

async function loadAllLeads(
    forceReload = false
) {


    /*
     * Do not repeatedly request
     * the same data unless Refresh
     * is clicked.
     */

    if (
        leadsLoaded &&
        !forceReload
    ) {

        return allLeads;

    }


    const response =
        await fetch(

            LEADS_API_URL +
            "?action=getLeads&t=" +
            Date.now(),

            {

                method:
                    "GET",

                cache:
                    "no-store"

            }

        );


    if (!response.ok) {

        throw new Error(
            "Unable to connect to patient database."
        );

    }


    const result =
        await response.json();


    console.log(
        "GET PATIENT DATA:",
        result
    );


    if (!result.success) {

        throw new Error(

            result.message ||
            "Unable to load patient data."

        );

    }


    allLeads =
        Array.isArray(
            result.leads
        )
            ? result.leads
            : [];


    leadsLoaded =
        true;


    return allLeads;

}



/* ======================================================
   RENDER CAMPS
====================================================== */

function renderCamps(
    camps
) {


    openCampId =
        null;


    if (
        !Array.isArray(camps) ||
        camps.length === 0
    ) {


        campTableBody.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty-message"
                >
                    No camps found.
                </td>

            </tr>

        `;


        return;

    }



    campTableBody.innerHTML =
        camps
            .map(
                function (camp) {


                    const safeCampId =
                        escapeHtml(
                            camp.id
                        );


                    /*
                     * IMPORTANT:
                     *
                     * We create TWO rows
                     * for every camp.
                     *
                     * 1. Normal camp row
                     * 2. Hidden patient data row
                     */


                    return `


                        <!-- CAMP ROW -->

                        <tr
                            class="camp-main-row"
                            id="camp-row-${safeCampId}"
                        >


                            <td
                                class="camp-id"
                            >

                                ${safeCampId}

                            </td>


                            <td>

                                ${escapeHtml(
                                    camp.createdDate
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    camp.createdTime
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    camp.campName
                                )}

                            </td>


                            <td>

                                ${formatDate(
                                    camp.campDate
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    camp.city
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    camp.doctorName
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    camp.campaigner
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    camp.counsellor
                                )}

                            </td>


                            <td>

                                <button
                                    type="button"
                                    class="view-data-btn"
                                    data-camp-id="${safeCampId}"
                                >
                                    View Data
                                </button>

                            </td>


                        </tr>



                        <!-- PATIENT DATA ROW -->

                        <tr
                            class="patient-expand-row"
                            id="patient-row-${safeCampId}"
                        >

                            <td
                                colspan="10"
                                class="patient-expand-cell"
                            >

                                <div
                                    id="patient-content-${safeCampId}"
                                    class="patient-panel"
                                >

                                </div>

                            </td>

                        </tr>


                    `;


                }
            )
            .join("");


    attachViewDataButtons();

}



/* ======================================================
   VIEW DATA BUTTON EVENTS
====================================================== */

function attachViewDataButtons() {


    document
        .querySelectorAll(
            ".view-data-btn"
        )
        .forEach(
            function (button) {


                button.addEventListener(
                    "click",
                    function () {


                        const campId =
                            this.dataset
                                .campId;


                        viewCampData(
                            campId,
                            this
                        );


                    }
                );


            }
        );

}



/* ======================================================
   VIEW CAMP DATA
====================================================== */

async function viewCampData(
    campId,
    button
) {


    /*
     * If same camp is already open,
     * do nothing.
     */

    if (
        String(openCampId) ===
        String(campId)
    ) {

        return;

    }


    /*
     * Close any previously
     * expanded camp.
     */

    closeAllPatientRows();


    const patientRow =
        document.getElementById(
            "patient-row-" +
            campId
        );


    const content =
        document.getElementById(
            "patient-content-" +
            campId
        );


    if (
        !patientRow ||
        !content
    ) {

        return;

    }


    patientRow.classList.add(
        "active"
    );


    openCampId =
        campId;


    content.innerHTML = `

        <div class="patient-loading">

            Loading patient data...

        </div>

    `;


    const originalText =
        button.textContent;


    button.disabled =
        true;


    button.textContent =
        "Loading...";


    try {


        /*
         * Get latest campaigner +
         * counsellor data.
         */

        await loadAllLeads(
            true
        );


        /*
         * CRITICAL:
         *
         * Match the patient
         * to this particular
         * Camp ID.
         */

        const campPatients =
            allLeads.filter(
                function (lead) {


                    return (

                        String(
                            lead.campId || ""
                        )
                        .trim()
                        .toLowerCase()

                        ===

                        String(
                            campId || ""
                        )
                        .trim()
                        .toLowerCase()

                    );


                }
            );


        const camp =
            allCamps.find(
                function (item) {


                    return (

                        String(
                            item.id
                        )
                        .trim()
                        .toLowerCase()

                        ===

                        String(
                            campId
                        )
                        .trim()
                        .toLowerCase()

                    );


                }
            );


        renderCampPatientData(

            campId,

            camp,

            campPatients

        );


    } catch (error) {


        console.error(
            "PATIENT LOAD ERROR:",
            error
        );


        content.innerHTML = `

            <div class="no-patient-data">

                <strong>
                    Unable to load patient data.
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message
                )}


                <div class="panel-footer">

                    <button
                        type="button"
                        class="cancel-data-btn"
                        onclick="
                            closeCampData(
                                '${escapeJs(campId)}'
                            )
                        "
                    >
                        Cancel
                    </button>

                </div>

            </div>

        `;


    } finally {


        button.disabled =
            false;


        button.textContent =
            originalText;


    }


}



/* ======================================================
   RENDER CAMP PATIENT DATA
====================================================== */

function renderCampPatientData(
    campId,
    camp,
    patients
) {


    const content =
        document.getElementById(
            "patient-content-" +
            campId
        );


    if (!content) {

        return;

    }


    const campName =
        camp
            ? camp.campName
            : campId;


    const campaigner =
        camp
            ? camp.campaigner
            : "-";


    const counsellor =
        camp
            ? camp.counsellor
            : "-";



    /*
     * NO DATA
     */

    if (
        !Array.isArray(patients) ||
        patients.length === 0
    ) {


        content.innerHTML = `


            <div class="patient-panel-header">


                <div>

                    <h3 class="patient-panel-title">

                        ${escapeHtml(
                            campName
                        )}
                        Patient Data

                    </h3>


                    <p class="patient-panel-subtitle">

                        Camp ID:
                        <strong>
                            ${escapeHtml(
                                campId
                            )}
                        </strong>

                        &nbsp; | &nbsp;

                        Campaigner:
                        ${escapeHtml(
                            campaigner
                        )}

                        &nbsp; | &nbsp;

                        Counsellor:
                        ${escapeHtml(
                            counsellor
                        )}

                    </p>

                </div>


                <span class="patient-count">

                    0 Patients

                </span>


            </div>



            <div class="no-patient-data">

                No patient data has been submitted
                for this camp yet.

            </div>



            <div class="panel-footer">

                <button
                    type="button"
                    class="cancel-data-btn"
                    onclick="
                        closeCampData(
                            '${escapeJs(campId)}'
                        )
                    "
                >
                    Cancel
                </button>

            </div>


        `;


        return;

    }



    /*
     * DATA EXISTS
     */

    const rows =
        patients
            .map(
                function (lead) {


                    return `

                        <tr>


                            <td
                                class="patient-id"
                            >

                                ${escapeHtml(
                                    lead.id ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    lead.date ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    lead.name ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    lead.age ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    lead.gender ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    lead.mobile ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    lead.city ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${displayValue(
                                    lead.source
                                )}

                            </td>


                            <td>

                                ${displayValue(
                                    lead.doctorName
                                )}

                            </td>


                            <td>

                                ${displayValue(
                                    lead.treatment
                                )}

                            </td>


                            <td>

                                <span
                                    class="status-badge"
                                >

                                    ${displayValue(
                                        lead.status
                                    )}

                                </span>

                            </td>


                            <td
                                class="email-value"
                            >

                                ${displayValue(
                                    lead.campaignerEmail ||
                                    campaigner
                                )}

                            </td>


                            <td
                                class="email-value"
                            >

                                ${escapeHtml(
                                    counsellor ||
                                    "-"
                                )}

                            </td>


                        </tr>

                    `;


                }
            )
            .join("");



    content.innerHTML = `


        <!-- HEADER -->

        <div class="patient-panel-header">


            <div>


                <h3 class="patient-panel-title">

                    ${escapeHtml(
                        campName
                    )}
                    Patient Data

                </h3>


                <p class="patient-panel-subtitle">

                    Camp ID:

                    <strong>
                        ${escapeHtml(
                            campId
                        )}
                    </strong>

                    &nbsp; | &nbsp;

                    Campaigner:

                    <strong>
                        ${escapeHtml(
                            campaigner
                        )}
                    </strong>

                    &nbsp; | &nbsp;

                    Counsellor:

                    <strong>
                        ${escapeHtml(
                            counsellor
                        )}
                    </strong>

                </p>


            </div>


            <span class="patient-count">

                ${patients.length}

                ${
                    patients.length === 1
                        ? "Patient"
                        : "Patients"
                }

            </span>


        </div>



        <!-- PATIENT TABLE -->

        <div class="patient-table-wrapper">


            <table class="patient-table">


                <thead>

                    <tr>

                        <th>
                            Patient ID
                        </th>

                        <th>
                            Date & Time
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Age
                        </th>

                        <th>
                            Gender
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            City
                        </th>

                        <th>
                            Source
                        </th>

                        <th>
                            Doctor
                        </th>

                        <th>
                            Treatment
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Campaigner
                        </th>

                        <th>
                            Counsellor
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${rows}

                </tbody>


            </table>


        </div>



        <!-- CANCEL -->

        <div class="panel-footer">

            <button
                type="button"
                class="cancel-data-btn"
                onclick="
                    closeCampData(
                        '${escapeJs(campId)}'
                    )
                "
            >
                Cancel
            </button>

        </div>


    `;


}



/* ======================================================
   CLOSE / MINIMIZE CAMP DATA
====================================================== */

function closeCampData(
    campId
) {


    const row =
        document.getElementById(
            "patient-row-" +
            campId
        );


    if (row) {

        row.classList.remove(
            "active"
        );

    }


    openCampId =
        null;


    /*
     * Scroll back to camp row.
     */

    const campRow =
        document.getElementById(
            "camp-row-" +
            campId
        );


    if (campRow) {

        campRow.scrollIntoView({

            behavior:
                "smooth",

            block:
                "center"

        });

    }


}



/* ======================================================
   CLOSE ALL EXPANDED DATA
====================================================== */

function closeAllPatientRows() {


    document
        .querySelectorAll(
            ".patient-expand-row"
        )
        .forEach(
            function (row) {


                row.classList.remove(
                    "active"
                );


            }
        );


    openCampId =
        null;

}



/* ======================================================
   SEARCH CAMPS
====================================================== */

searchInput.addEventListener(
    "input",
    function () {


        const term =
            this.value
                .trim()
                .toLowerCase();


        if (!term) {


            renderCamps(
                allCamps
            );


            return;

        }


        const filtered =
            allCamps.filter(
                function (camp) {


                    const searchable =
                        [

                            camp.id,

                            camp.campName,

                            camp.campDate,

                            camp.city,

                            camp.doctorName,

                            camp.campaigner,

                            camp.counsellor

                        ]
                        .join(
                            " "
                        )
                        .toLowerCase();


                    return searchable
                        .includes(
                            term
                        );


                }
            );


        renderCamps(
            filtered
        );


    }
);



/* ======================================================
   STATISTICS
====================================================== */

function updateStatistics() {


    totalCampsElement
        .textContent =
            allCamps.length;


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const upcoming =
        allCamps.filter(
            function (camp) {


                const date =
                    parseCampDate(
                        camp.campDate
                    );


                if (!date) {

                    return false;

                }


                return (
                    date >= today
                );


            }
        );


    upcomingCampsElement
        .textContent =
            upcoming.length;

}



/* ======================================================
   PARSE CAMP DATE
====================================================== */

function parseCampDate(
    value
) {


    if (!value) {

        return null;

    }


    const text =
        String(
            value
        )
        .trim();


    /*
     * yyyy-mm-dd
     */

    let match =
        text.match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if (match) {


        return new Date(

            Number(
                match[1]
            ),

            Number(
                match[2]
            ) - 1,

            Number(
                match[3]
            )

        );


    }


    /*
     * dd-mm-yyyy
     */

    match =
        text.match(
            /^(\d{2})-(\d{2})-(\d{4})$/
        );


    if (match) {


        return new Date(

            Number(
                match[3]
            ),

            Number(
                match[2]
            ) - 1,

            Number(
                match[1]
            )

        );


    }


    return null;

}



/* ======================================================
   FORMAT CAMP DATE
====================================================== */

function formatDate(
    value
) {


    const date =
        parseCampDate(
            value
        );


    if (!date) {


        return escapeHtml(
            value ||
            "-"
        );


    }


    const day =
        String(
            date.getDate()
        )
        .padStart(
            2,
            "0"
        );


    const month =
        String(
            date.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );


    const year =
        date.getFullYear();


    return (
        day +
        "-" +
        month +
        "-" +
        year
    );

}



/* ======================================================
   DISPLAY EMPTY VALUES
====================================================== */

function displayValue(
    value
) {


    const text =
        String(
            value == null
                ? ""
                : value
        )
        .trim();


    if (
        !text ||
        text === "-"
    ) {

        return "-";

    }


    return escapeHtml(
        text
    );

}



/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(
    value
) {


    return String(
        value == null
            ? ""
            : value
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}



/* ======================================================
   ESCAPE JAVASCRIPT STRING
====================================================== */

function escapeJs(
    value
) {


    return String(
        value == null
            ? ""
            : value
    )

    .replaceAll(
        "\\",
        "\\\\"
    )

    .replaceAll(
        "'",
        "\\'"
    )

    .replaceAll(
        "\n",
        ""
    )

    .replaceAll(
        "\r",
        ""
    );

}



/* ======================================================
   REFRESH
====================================================== */

refreshBtn.addEventListener(
    "click",
    async function () {


        searchInput.value =
            "";


        closeAllPatientRows();


        /*
         * Force patient data
         * to be fetched again.
         */

        leadsLoaded =
            false;


        allLeads =
            [];


        await loadCamps();


    }
);

loadCamps();
